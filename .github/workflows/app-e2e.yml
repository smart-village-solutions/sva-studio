name: App E2E

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'E2E source'
        required: true
        default: diagnostic
        type: choice
        options: [diagnostic, hotfix]
      hotfix_base_tag:
        description: 'Verified Production base tag (hotfix only)'
        type: string
      hotfix_ref:
        description: 'refs/heads/hotfix/... (hotfix only)'
        type: string
      hotfix_sha:
        description: 'Exact hotfix source commit (hotfix only)'
        type: string

permissions:
  contents: read

jobs:
  e2e:
    name: App E2E Shard (${{ matrix.shard }}/4)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SVA_AUTH_ISSUER: https://accounts.google.com
      SVA_AUTH_CLIENT_ID: gha-e2e-client
      SVA_AUTH_CLIENT_SECRET: gha-e2e-secret
      SVA_AUTH_REDIRECT_URI: http://localhost:3000/auth/callback
      SVA_AUTH_POST_LOGOUT_REDIRECT_URI: http://localhost:3000/
      REDIS_URL: redis://127.0.0.1:6379
      PLAYWRIGHT_MAX_FAILURES: '0'
      APP_E2E_ALLOW_RETRY: ${{ github.event_name != 'push' && inputs.mode != 'hotfix' && 'true' || 'false' }}

    steps:
      - name: Checkout hotfix workflow controller
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'hotfix'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .e2e-controller
          fetch-depth: 0

      - name: Setup hotfix controller Node.js runtime
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'hotfix'
        uses: actions/setup-node@v6
        with:
          node-version-file: .e2e-controller/.nvmrc

      - name: Validate hotfix source before checkout
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'hotfix'
        id: hotfix
        env:
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
          HOTFIX_BASE_TAG: ${{ inputs.hotfix_base_tag }}
          HOTFIX_REF: ${{ inputs.hotfix_ref }}
          HOTFIX_SHA: ${{ inputs.hotfix_sha }}
        working-directory: .e2e-controller
        run: node --experimental-strip-types scripts/ci/hotfix-source-contract.ts

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.hotfix.outputs.source_sha || github.sha }}
          fetch-depth: 0

      - name: Bind tested source revision
        id: source
        env:
          EXPECTED_SOURCE_SHA: ${{ steps.hotfix.outputs.source_sha || github.sha }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse --verify HEAD)"
          test "${source_sha}" = "${EXPECTED_SOURCE_SHA}"
          echo "sha=${source_sha}" >> "${GITHUB_OUTPUT}"

      - name: Setup workspace
        uses: ./.github/actions/setup-pnpm-workspace

      - name: Install Playwright browsers
        run: pnpm --filter sva-studio-react exec playwright install chromium

      - name: Start Redis for E2E
        run: docker run -d --name sva-studio-redis-e2e -p 6379:6379 redis:7-alpine

      - name: Start required services
        run: docker compose -f compose.monitoring.yaml up -d loki otel-collector promtail

      - name: Wait for Redis readiness
        run: |
          set -euo pipefail
          for i in {1..30}; do
            if docker exec sva-studio-redis-e2e redis-cli -p 6379 ping | grep -q PONG; then
              echo "Redis is ready"
              exit 0
            fi
            echo "Waiting for Redis ($i/30)..."
            sleep 2
          done
          echo "Redis did not become ready in time"
          docker ps -a
          exit 1

      - name: Run complete app E2E suite uncached
        id: app_e2e
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ github.workspace }}/apps/sva-studio-react/.nx/app-e2e-results.json
        run: pnpm nx run sva-studio-react:test:e2e --skipNxCache --shard=${{ matrix.shard }}/4 --workers=1 --reporter=list,json,html

      - name: Inventory complete E2E selection
        if: always()
        run: |
          mkdir -p apps/sva-studio-react/.nx
          PLAYWRIGHT_JSON_OUTPUT_FILE=.nx/app-e2e-manifest.json pnpm --filter sva-studio-react exec playwright test --list --reporter=json

      - name: Checkout trusted shard evidence writer
        if: always()
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .nx/e2e-controller
          filter: tree:0

      - name: Write source-bound E2E shard evidence
        if: always() && steps.source.outputs.sha != ''
        env:
          APP_E2E_SHARD_INDEX: ${{ matrix.shard }}
          APP_E2E_SOURCE_SHA: ${{ steps.source.outputs.sha }}
          APP_E2E_TEST_OUTCOME: ${{ steps.app_e2e.outcome }}
          APP_E2E_SHARD_DIRECTORY: artifacts/app-e2e-shards
          APP_E2E_MANIFEST_PATH: apps/sva-studio-react/.nx/app-e2e-manifest.json
          APP_E2E_REPORT_PATH: apps/sva-studio-react/.nx/app-e2e-results.json
        run: node --experimental-strip-types .nx/e2e-controller/scripts/ci/write-app-e2e-evidence.ts

      - name: Upload E2E shard evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-e2e-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: artifacts/app-e2e-shards/app-e2e-shard-${{ matrix.shard }}.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-e2e-report-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/sva-studio-react/playwright-report
            apps/sva-studio-react/test-results
          if-no-files-found: warn
          retention-days: 7

      - name: Stop services
        if: always()
        run: |
          docker compose -f compose.monitoring.yaml down
          docker rm -f sva-studio-redis-e2e || true

  evidence:
    name: App E2E
    needs: e2e
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout evidence writer
        uses: actions/checkout@v7

      - name: Setup finalizer Node.js runtime
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Download E2E shard evidence
        uses: actions/download-artifact@v8
        with:
          pattern: app-e2e-shard-*-${{ github.run_id }}
          path: artifacts/app-e2e-shards
          merge-multiple: true

      - name: Write redacted App E2E evidence
        id: evidence
        env:
          APP_E2E_RESULT: ${{ needs.e2e.result }}
          APP_E2E_TEST_OUTCOME: ${{ needs.e2e.result == 'success' && 'success' || 'failure' }}
          APP_E2E_SHARD_DIRECTORY: artifacts/app-e2e-shards
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
          HOTFIX_SOURCE_SHA: ${{ inputs.hotfix_sha }}
          HOTFIX_BASE_TAG: ${{ inputs.hotfix_base_tag }}
          HOTFIX_REF: ${{ inputs.hotfix_ref }}
          HOTFIX_MODE: ${{ inputs.mode }}
        run: node --experimental-strip-types scripts/ci/write-app-e2e-evidence.ts

      - name: Upload App E2E evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-e2e-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/app-e2e-evidence-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: error
          retention-days: 30
