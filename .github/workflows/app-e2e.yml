name: App E2E

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: App E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      test-outcome: ${{ steps.app_e2e.outcome }}
    env:
      SVA_AUTH_ISSUER: https://accounts.google.com
      SVA_AUTH_CLIENT_ID: gha-e2e-client
      SVA_AUTH_CLIENT_SECRET: gha-e2e-secret
      SVA_AUTH_REDIRECT_URI: http://localhost:3000/auth/callback
      SVA_AUTH_POST_LOGOUT_REDIRECT_URI: http://localhost:3000/
      REDIS_URL: redis://127.0.0.1:6379
      PLAYWRIGHT_MAX_FAILURES: '0'
      APP_E2E_ALLOW_RETRY: ${{ github.event_name != 'push' && 'true' || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup workspace
        uses: ./.github/actions/setup-pnpm-workspace

      - name: Prefer HTTPS Ubuntu archives for Playwright dependencies
        run: |
          set -euo pipefail
          sudo sed -i '/^http:\/\/azure\.archive\.ubuntu\.com\/ubuntu\//d' /etc/apt/apt-mirrors.txt
          if grep -q '^http://azure\.archive\.ubuntu\.com/ubuntu/' /etc/apt/apt-mirrors.txt; then
            echo 'The Azure Ubuntu mirror must not be selected for Playwright dependencies.' >&2
            exit 1
          fi
          grep -q '^https://archive\.ubuntu\.com/ubuntu/' /etc/apt/apt-mirrors.txt

      - name: Install Playwright browsers
        run: pnpm --filter sva-studio-react exec playwright install --with-deps chromium

      - name: Start Redis for E2E
        run: docker run -d --name sva-studio-redis-e2e -p 6379:6379 redis:7-alpine

      - name: Start required services
        run: docker compose -f compose.monitoring.yaml up -d loki otel-collector promtail

      - name: Wait for Redis readiness
        run: |
          set -euo pipefail
          for i in {1..30}; do
            if docker exec sva-studio-redis-e2e redis-cli -p 6379 ping | grep -q PONG; then
              echo "Redis is ready"
              exit 0
            fi
            echo "Waiting for Redis ($i/30)..."
            sleep 2
          done
          echo "Redis did not become ready in time"
          docker ps -a
          exit 1

      - name: Run complete app E2E suite uncached
        id: app_e2e
        run: pnpm nx run sva-studio-react:test:e2e --skipNxCache

      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-e2e-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/sva-studio-react/playwright-report
            apps/sva-studio-react/test-results
          if-no-files-found: warn
          retention-days: 7

      - name: Stop services
        if: always()
        run: |
          docker compose -f compose.monitoring.yaml down
          docker rm -f sva-studio-redis-e2e || true

  evidence:
    name: App E2E Evidence
    needs: e2e
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout evidence writer
        uses: actions/checkout@v7

      - name: Setup finalizer Node.js runtime
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Write redacted App E2E evidence
        id: evidence
        env:
          APP_E2E_RESULT: ${{ needs.e2e.result }}
          APP_E2E_TEST_OUTCOME: ${{ needs.e2e.outputs.test-outcome }}
        run: node --experimental-strip-types scripts/ci/write-app-e2e-evidence.ts

      - name: Upload App E2E evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-e2e-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/app-e2e-evidence-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: error
          retention-days: 30
