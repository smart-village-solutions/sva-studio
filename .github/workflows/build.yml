name: Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-main
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  id-token: write
  packages: write

jobs:
  build:
    name: Build
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      backup_agent_image_digest: ${{ steps.build_backup_agent_image.outputs.digest }}
      image_digest: ${{ steps.build_image.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup workspace
        uses: ./.github/actions/setup-pnpm-workspace

      - name: Verify final runtime artifact
        run: pnpm nx run sva-studio-react:verify:runtime-artifact

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        id: build_image
        uses: docker/build-push-action@v7
        with:
          build-args: |
            SVA_IMAGE_REVISION=${{ github.sha }}
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/smart-village-solutions/sva-studio:${{ github.sha }}
            ghcr.io/smart-village-solutions/sva-studio:latest

      - name: Build and push backup agent image
        id: build_backup_agent_image
        uses: docker/build-push-action@v7
        with:
          build-args: |
            SVA_IMAGE_REVISION=${{ github.sha }}
          context: .
          file: ./deploy/backup-agent/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/smart-village-solutions/sva-studio-backup-agent:${{ github.sha }}
            ghcr.io/smart-village-solutions/sva-studio-backup-agent:latest

  promote-dev:
    name: Promote dev
    if: github.event_name == 'push'
    needs: build
    uses: ./.github/workflows/promote.yml
    secrets: inherit
    with:
      bootstrap_mode: auto
      change_base: ${{ github.event.before }}
      change_head: ${{ github.sha }}
      environment: dev
      image_ref: ${{ needs.build.outputs.image_digest }}
      migration_mode: auto
