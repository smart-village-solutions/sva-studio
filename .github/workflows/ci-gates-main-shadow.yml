# Der Dateiname bleibt bis nach dem Cutover als stabiler Migrationsanker bestehen.
# Name und Verhalten sind produktiv.
name: CI Gates (Main and Nightly)

concurrency:
  group: ci-gates-main-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
      - uses: ./.github/actions/setup-pnpm-workspace
      - run: pnpm test:eslint

  unit:
    name: Unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
      - uses: ./.github/actions/setup-pnpm-workspace
      - run: pnpm test:unit

  types:
    name: Types
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
      - uses: ./.github/actions/setup-pnpm-workspace
      - run: pnpm test:types

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      REDIS_URL: redis://127.0.0.1:6379
      COVERAGE_GATE_REQUIRE_SUMMARIES: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-pnpm-workspace
      - name: Start Redis
        run: docker run -d --name sva-studio-redis-coverage -p 6379:6379 redis:7-alpine
      - name: Wait for Redis readiness
        run: |
          set -euo pipefail
          for i in {1..30}; do
            if docker exec sva-studio-redis-coverage redis-cli -p 6379 ping | grep -q PONG; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Run full Coverage contract
        run: |
          pnpm test:coverage
          pnpm coverage-gate
      - name: Upload to Codecov
        if: always() && env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v7
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: ./apps/**/coverage/lcov.info,./packages/**/coverage/lcov.info
          disable_search: true
          fail_ci_if_error: false
          flags: unittests
          name: coverage-${{ github.run_id }}
      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports-${{ github.run_id }}
          path: |
            **/coverage/coverage-summary.json
            **/coverage/lcov.info
            tooling/testing/coverage-policy.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Prepare SonarCloud coverage report
        if: always() && env.SONAR_TOKEN != ''
        run: pnpm sonar:prepare-lcov
      - name: Setup Java for SonarCloud
        if: always() && env.SONAR_TOKEN != ''
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: SonarCloud Scan
        if: always() && env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v7
        with:
          args: >
            -Dsonar.scanner.skipJreProvisioning=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Stop Redis
        if: always()
        run: docker rm -f sva-studio-redis-coverage || true

  complexity:
    name: Complexity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0
      - uses: ./.github/actions/setup-pnpm-workspace
      - run: pnpm complexity-gate

  integration:
    name: Integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
      - uses: ./.github/actions/setup-pnpm-workspace
      - name: Run full Integration contract
        env:
          POSTGRES_PASSWORD: test-postgres-password
          APP_DB_USER: sva_app
          APP_DB_PASSWORD: test-app-password
          REDIS_PASSWORD: test-redis-password
          SVA_RUNTIME_PROFILE: studio
        run: pnpm test:integration

  file-placement:
    name: File Placement
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
      - uses: ./.github/actions/setup-pnpm-workspace
      - run: |
          pnpm check:file-placement
          pnpm check:rollout-docs

  a11y:
    name: A11y
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
      - uses: ./.github/actions/setup-pnpm-workspace
      - run: pnpm test:a11y

  documentation-integrity:
    name: Documentation Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
      - uses: ./.github/actions/setup-pnpm-workspace
      - run: pnpm check:docs

  documentation-catalog:
    name: Documentation Catalog (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
      - uses: ./.github/actions/setup-pnpm-workspace
      - continue-on-error: true
        run: pnpm nx run sva-studio-react:check:documentation-catalog

  db-schema:
    name: DB Schema Snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0
      - uses: ./.github/actions/setup-pnpm-workspace
      - run: pnpm exec tsx scripts/ci/check-db-schema-snapshot.ts
