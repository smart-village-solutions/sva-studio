name: CI Gate Topology Shadow (Main and Nightly)

concurrency:
  group: ci-gates-main-shadow-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: read

jobs:
  lint:
    name: CI Shadow Main / Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
      - uses: ./.github/actions/setup-pnpm-workspace
      - run: pnpm test:eslint

  unit:
    name: CI Shadow Main / Unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
      - uses: ./.github/actions/setup-pnpm-workspace
      - run: pnpm test:unit

  types:
    name: CI Shadow Main / Types
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
      - uses: ./.github/actions/setup-pnpm-workspace
      - run: pnpm test:types

  coverage:
    name: CI Shadow Main / Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      REDIS_URL: redis://127.0.0.1:6379
      COVERAGE_GATE_REQUIRE_SUMMARIES: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
      - uses: ./.github/actions/setup-pnpm-workspace
      - name: Start Redis
        run: docker run -d --name sva-studio-redis-main-shadow -p 6379:6379 redis:7-alpine
      - name: Wait for Redis readiness
        run: |
          set -euo pipefail
          for i in {1..30}; do
            if docker exec sva-studio-redis-main-shadow redis-cli -p 6379 ping | grep -q PONG; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Run full Coverage contract
        run: |
          pnpm test:coverage
          pnpm coverage-gate
      - name: Stop Redis
        if: always()
        run: docker rm -f sva-studio-redis-main-shadow || true

  complexity:
    name: CI Shadow Main / Complexity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0
      - uses: ./.github/actions/setup-pnpm-workspace
      - run: pnpm complexity-gate

  integration:
    name: CI Shadow Main / Integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
      - uses: ./.github/actions/setup-pnpm-workspace
      - name: Run full Integration contract
        env:
          POSTGRES_PASSWORD: test-postgres-password
          APP_DB_USER: sva_app
          APP_DB_PASSWORD: test-app-password
          REDIS_PASSWORD: test-redis-password
          SVA_RUNTIME_PROFILE: studio
        run: pnpm test:integration

  file-placement:
    name: CI Shadow Main / File Placement
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
      - uses: ./.github/actions/setup-pnpm-workspace
      - run: |
          pnpm check:file-placement
          pnpm check:rollout-docs

  a11y:
    name: CI Shadow Main / A11y
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
      - uses: ./.github/actions/setup-pnpm-workspace
      - run: pnpm test:a11y

  documentation-integrity:
    name: CI Shadow Main / Documentation Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
      - uses: ./.github/actions/setup-pnpm-workspace
      - run: pnpm check:docs

  documentation-catalog:
    name: CI Shadow Main / Documentation Catalog (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
      - uses: ./.github/actions/setup-pnpm-workspace
      - continue-on-error: true
        run: pnpm nx run sva-studio-react:check:documentation-catalog

  db-schema:
    name: CI Shadow Main / DB Schema Snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0
      - uses: ./.github/actions/setup-pnpm-workspace
      - run: pnpm exec tsx scripts/ci/check-db-schema-snapshot.ts

  parity:
    name: CI Shadow Main / Parity
    if: always()
    needs:
      - lint
      - unit
      - types
      - coverage
      - complexity
      - integration
      - file-placement
      - a11y
      - documentation-integrity
      - documentation-catalog
      - db-schema
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout parity validator
        uses: actions/checkout@v7
        with:
          filter: blob:none
          sparse-checkout: |
            .nvmrc
            scripts/ci
      - name: Setup repository Node.js runtime
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Collect exact-head main or nightly parity
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/ci-shadow-main
          mkdir -p artifacts/ci-shadow-main/jobs
          current_run_created_at=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq .created_at)
          for attempt in {1..40}; do
            gh api \
              -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${HEAD_SHA}&event=${EVENT_NAME}&per_page=100" \
              > artifacts/ci-shadow-main/workflow-runs.json
            jq --arg anchor "$current_run_created_at" \
              '($anchor | fromdateiso8601) as $time | .workflow_runs |= map(select(((.created_at | fromdateiso8601) - $time | fabs) <= 900))' \
              artifacts/ci-shadow-main/workflow-runs.json \
              > artifacts/ci-shadow-main/workflow-runs.current.json
            comparison_started_at=$(jq -r '[.workflow_runs[].created_at] | min' artifacts/ci-shadow-main/workflow-runs.current.json)
            for run_id in $(jq -r '.workflow_runs[].id' artifacts/ci-shadow-main/workflow-runs.current.json); do
              gh api \
                -H 'Accept: application/vnd.github+json' \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?filter=latest&per_page=100" \
                > "artifacts/ci-shadow-main/jobs/${run_id}.json"
            done
            jq -s \
              '{check_runs: [.[].jobs[] | {name, head_sha, status, conclusion, started_at, completed_at, details_url: .html_url}]}' \
              artifacts/ci-shadow-main/jobs/*.json \
              > artifacts/ci-shadow-main/check-runs.json
            set +e
            node scripts/ci/ci-gate-main-shadow-parity.cli.ts \
              --checks artifacts/ci-shadow-main/check-runs.json \
              --output artifacts/ci-shadow-main/parity.json \
              --head "$HEAD_SHA" \
              --event "$EVENT_NAME" \
              --comparison-started-at "$comparison_started_at"
            parity_status=$?
            set -e
            if [ "$parity_status" -eq 0 ]; then exit 0; fi
            if [ "$parity_status" -eq 1 ]; then exit 1; fi
            sleep 10
          done
          node scripts/ci/ci-gate-main-shadow-parity.cli.ts \
            --checks artifacts/ci-shadow-main/check-runs.json \
            --output artifacts/ci-shadow-main/parity.json \
            --head "$HEAD_SHA" \
            --event "$EVENT_NAME" \
            --comparison-started-at "$comparison_started_at" \
            --fail-pending
      - name: Upload main and nightly parity evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-gate-main-shadow-parity-${{ github.run_id }}
          path: artifacts/ci-shadow-main/parity.json
          if-no-files-found: error
          overwrite: true
          retention-days: 30
