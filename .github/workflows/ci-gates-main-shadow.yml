# Der Dateiname bleibt bis nach dem Cutover als stabiler Migrationsanker bestehen.
# Name und Verhalten sind produktiv.
name: CI Gates (Main and Nightly)

concurrency:
  group: ci-gates-main-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
      - uses: ./.github/actions/setup-pnpm-workspace
      - run: pnpm test:eslint

  unit-residual:
    name: Unit Residual
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm-workspace
      - name: Run Unit tests without an identical instrumented command
        run: pnpm exec tsx scripts/ci/affected-unit-gate.ts --residual-only

  unit:
    name: Unit
    if: always()
    needs: [unit-residual, coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require residual and instrumented test execution
        env:
          RESIDUAL_RESULT: ${{ needs.unit-residual.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
        run: |
          test "$RESIDUAL_RESULT" = success
          test "$COVERAGE_RESULT" = success

  types:
    name: Types
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
      - uses: ./.github/actions/setup-pnpm-workspace
      - run: pnpm test:types

  coverage-priority:
    name: Coverage Priority (${{ matrix.partition }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        partition:
          [app-1, app-2, app-3, app-4, waste-1, waste-2, direct-1, direct-2, direct-3, direct-4]
    env:
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0
      - name: Setup workspace
        uses: ./.github/actions/setup-pnpm-workspace
      - name: Start Redis
        run: docker run -d --name sva-studio-redis-coverage -p 6379:6379 redis:7-alpine
      - name: Wait for Redis readiness
        run: |
          for i in {1..30}; do
            if docker exec sva-studio-redis-coverage redis-cli ping | grep -q PONG; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Run Coverage partition
        env:
          NX_BASE: ${{ github.sha }}
          NX_HEAD: ${{ github.sha }}
          NX_RUN_FULL: '1'
        run: pnpm exec tsx scripts/ci/affected-coverage-gate.ts --base ${{ github.sha }} --head ${{ github.sha }} --partition ${{ matrix.partition }}
      - name: Upload partition reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-partition-${{ matrix.partition }}
          path: |
            apps/*/coverage/**
            packages/*/coverage/**
            artifacts/ci-feedback/coverage-partitions/${{ matrix.partition }}.json
            artifacts/ci-feedback/coverage-coverage-${{ matrix.partition }}.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Stop Redis
        if: always()
        run: docker rm -f sva-studio-redis-coverage || true

  coverage-remaining:
    name: Coverage Remaining (${{ matrix.partition }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        partition: [remaining-1, remaining-2, remaining-3, remaining-4]
    env:
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0
      - name: Setup workspace
        uses: ./.github/actions/setup-pnpm-workspace
      - name: Start Redis
        run: docker run -d --name sva-studio-redis-coverage -p 6379:6379 redis:7-alpine
      - name: Wait for Redis readiness
        run: |
          for i in {1..30}; do
            if docker exec sva-studio-redis-coverage redis-cli ping | grep -q PONG; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Run Coverage partition
        env:
          NX_BASE: ${{ github.sha }}
          NX_HEAD: ${{ github.sha }}
          NX_RUN_FULL: '1'
        run: pnpm exec tsx scripts/ci/affected-coverage-gate.ts --base ${{ github.sha }} --head ${{ github.sha }} --partition ${{ matrix.partition }}
      - name: Upload partition reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-partition-${{ matrix.partition }}
          path: |
            apps/*/coverage/**
            packages/*/coverage/**
            artifacts/ci-feedback/coverage-partitions/${{ matrix.partition }}.json
            artifacts/ci-feedback/coverage-coverage-${{ matrix.partition }}.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Stop Redis
        if: always()
        run: docker rm -f sva-studio-redis-coverage || true

  coverage:
    name: Coverage
    if: always()
    needs: [coverage-priority, coverage-remaining]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      COVERAGE_GATE_REQUIRE_SUMMARIES: '1'
      NX_RUN_FULL: '1'
    steps:
      - name: Require all instrumented partitions
        env:
          PRIORITY_RESULT: ${{ needs.coverage-priority.result }}
          REMAINING_RESULT: ${{ needs.coverage-remaining.result }}
        run: |
          test "$PRIORITY_RESULT" = success
          test "$REMAINING_RESULT" = success
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-pnpm-workspace
      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-partition-*
          path: artifacts/downloaded-coverage-parts
      - name: Merge and evaluate full Coverage contract
        run: |
          pnpm exec tsx scripts/ci/affected-coverage-gate.ts --base ${{ github.sha }} --head ${{ github.sha }} --merge-partitions artifacts/downloaded-coverage-parts
          pnpm coverage-gate
      - name: Upload to Codecov
        if: always() && env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v7
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: ./apps/**/coverage/lcov.info,./packages/**/coverage/lcov.info
          disable_search: true
          fail_ci_if_error: false
          flags: unittests
          name: coverage-${{ github.run_id }}
      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports-${{ github.run_id }}
          path: |
            apps/*/coverage/coverage-summary.json
            apps/*/coverage/lcov.info
            packages/*/coverage/coverage-summary.json
            packages/*/coverage/lcov.info
            tooling/testing/coverage-policy.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  sonar:
    name: SonarCloud
    needs: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-pnpm-workspace
        if: env.SONAR_TOKEN != ''
      - uses: actions/download-artifact@v8
        if: env.SONAR_TOKEN != ''
        with:
          name: coverage-reports-${{ github.run_id }}
          path: .
      - name: Prepare SonarCloud coverage report
        if: env.SONAR_TOKEN != ''
        run: pnpm sonar:prepare-lcov
      - name: Setup Java for SonarCloud
        if: env.SONAR_TOKEN != ''
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: SonarCloud Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v7
        with:
          args: >
            -Dsonar.scanner.skipJreProvisioning=true
            -Dsonar.verbose=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  complexity:
    name: Complexity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0
      - uses: ./.github/actions/setup-pnpm-workspace
      - run: pnpm complexity-gate

  integration:
    name: Integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
      - uses: ./.github/actions/setup-pnpm-workspace
      - name: Run full Integration contract
        env:
          POSTGRES_PASSWORD: test-postgres-password
          APP_DB_USER: sva_app
          APP_DB_PASSWORD: test-app-password
          REDIS_PASSWORD: test-redis-password
          SVA_RUNTIME_PROFILE: studio
        run: pnpm test:integration

  file-placement:
    name: File Placement
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
      - uses: ./.github/actions/setup-pnpm-workspace
      - run: |
          pnpm check:file-placement
          pnpm check:rollout-docs

  a11y:
    name: A11y
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
      - uses: ./.github/actions/setup-pnpm-workspace
      - run: pnpm test:a11y

  documentation-integrity:
    name: Documentation Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
      - uses: ./.github/actions/setup-pnpm-workspace
      - run: pnpm check:docs

  documentation-catalog:
    name: Documentation Catalog (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
      - uses: ./.github/actions/setup-pnpm-workspace
      - continue-on-error: true
        run: pnpm nx run sva-studio-react:check:documentation-catalog

  db-schema:
    name: DB Schema Snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0
      - uses: ./.github/actions/setup-pnpm-workspace
      - run: pnpm exec tsx scripts/ci/check-db-schema-snapshot.ts

  plugin-compatibility:
    name: Plugin Reference
    permissions:
      contents: read
      id-token: write
    uses: smart-village-solutions/sva-studio_plugin-application-overview/.github/workflows/quality.yml@f93fafc79f48d799883f8b05e4973d18904a9382
    with:
      plugin-ref: f93fafc79f48d799883f8b05e4973d18904a9382
      studio-ref: ${{ github.sha }}
