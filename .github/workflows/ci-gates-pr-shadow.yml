# Der Dateiname bleibt bis nach dem Cutover als Trigger-Anker bestehen, weil GitHub
# pull_request-Workflows vom Default-Branch registriert. Name und Verhalten sind produktiv.
name: CI Gates (PR)

concurrency:
  group: ci-gates-pr-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  scope:
    name: CI Scope
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      code_relevant: ${{ steps.scope.outputs.code_relevant }}
      quality_gate_mode: ${{ steps.scope.outputs.quality_gate_mode }}
      coverage_mode: ${{ steps.scope.outputs.coverage_mode }}
      integration_mode: ${{ steps.scope.outputs.integration_mode }}
      a11y_mode: ${{ steps.scope.outputs.a11y_mode }}
      runtime_verify_mode: ${{ steps.scope.outputs.runtime_verify_mode }}
      app_build_mode: ${{ steps.scope.outputs.app_build_mode }}
      documentation_catalog_mode: ${{ steps.scope.outputs.documentation_catalog_mode }}
      db_schema_mode: ${{ steps.scope.outputs.db_schema_mode }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0

      - name: Setup workspace
        uses: ./.github/actions/setup-pnpm-workspace

      - name: Determine canonical PR scope once
        id: scope
        run: >-
          pnpm exec tsx scripts/ci/pr-scope.cli.ts
          --base ${{ github.event.pull_request.base.sha }}
          --head ${{ github.event.pull_request.head.sha }}
          --github-output
          --evidence-path artifacts/ci-gates/pr-scope.json

      - name: Upload canonical scope evidence
        uses: actions/upload-artifact@v7
        with:
          name: ci-gate-scope-${{ github.run_id }}
          path: artifacts/ci-gates/pr-scope.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  lint:
    name: Lint
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0
      - name: Setup workspace
        if: needs.scope.outputs.quality_gate_mode != 'skip'
        uses: ./.github/actions/setup-pnpm-workspace
      - name: Run lint contract
        if: needs.scope.outputs.quality_gate_mode != 'skip'
        env:
          NX_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ needs.scope.outputs.quality_gate_mode }}" = 'full' ]; then
            pnpm test:eslint
          else
            pnpm test:eslint:affected
          fi

  unit-direct:
    name: Unit Fast Feedback
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0
      - name: Setup workspace
        if: needs.scope.outputs.quality_gate_mode != 'skip'
        uses: ./.github/actions/setup-pnpm-workspace
      - name: Run direct Unit phase
        if: needs.scope.outputs.quality_gate_mode != 'skip'
        env:
          NX_BASE: ${{ github.event.pull_request.base.sha }}
          NX_HEAD: ${{ github.event.pull_request.head.sha }}
          NX_RUN_FULL: ${{ needs.scope.outputs.quality_gate_mode == 'full' && '1' || '0' }}
        run: pnpm test:unit:affected --phase direct
      - name: Upload direct Unit evidence
        if: always() && needs.scope.outputs.code_relevant == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: unit-feedback-direct-${{ github.run_id }}
          path: artifacts/ci-feedback/unit-unit-direct.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  unit-remaining:
    name: Unit Complete
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0
      - name: Setup workspace
        if: needs.scope.outputs.quality_gate_mode != 'skip'
        uses: ./.github/actions/setup-pnpm-workspace
      - name: Run remaining Unit phase
        if: needs.scope.outputs.quality_gate_mode != 'skip'
        env:
          NX_BASE: ${{ github.event.pull_request.base.sha }}
          NX_HEAD: ${{ github.event.pull_request.head.sha }}
          NX_RUN_FULL: ${{ needs.scope.outputs.quality_gate_mode == 'full' && '1' || '0' }}
        run: pnpm test:unit:affected --phase remaining
      - name: Upload remaining Unit evidence
        if: always() && needs.scope.outputs.code_relevant == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: unit-feedback-remaining-${{ github.run_id }}
          path: artifacts/ci-feedback/unit-unit-remaining.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  unit:
    name: Unit
    if: always()
    needs:
      - scope
      - unit-direct
      - unit-remaining
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Unit evidence validator
        uses: actions/checkout@v7
        with:
          filter: blob:none
          sparse-checkout: |
            .nvmrc
            scripts/ci
      - name: Setup aggregator Node.js runtime
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Download Unit evidence
        if: needs.scope.outputs.code_relevant == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: unit-feedback-*-${{ github.run_id }}
          path: artifacts/downloaded-unit-feedback
          merge-multiple: true
      - name: Aggregate required Unit status
        env:
          EVIDENCE_REQUIRED: ${{ needs.scope.outputs.code_relevant }}
          SCOPE_RESULT: ${{ needs.scope.result }}
          DIRECT_RESULT: ${{ needs.unit-direct.result }}
          REMAINING_RESULT: ${{ needs.unit-remaining.result }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$SCOPE_RESULT" = "success"
          test "$DIRECT_RESULT" = "success"
          test "$REMAINING_RESULT" = "success"
          if [ "$EVIDENCE_REQUIRED" != "true" ]; then
            exit 0
          fi
          node scripts/ci/ci-feedback-aggregate.ts \
            --gate unit \
            --head "$HEAD_SHA" \
            --expected unit-direct,unit-remaining \
            --evidence-dir artifacts/downloaded-unit-feedback

  types:
    name: Types
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0
      - name: Setup workspace
        if: needs.scope.outputs.quality_gate_mode != 'skip'
        uses: ./.github/actions/setup-pnpm-workspace
      - name: Run Types contract
        if: needs.scope.outputs.quality_gate_mode != 'skip'
        env:
          NX_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ needs.scope.outputs.quality_gate_mode }}" = 'full' ]; then
            pnpm test:types
          else
            pnpm test:types:affected
          fi

  coverage:
    name: Coverage Complete
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0
      - name: Setup workspace
        if: needs.scope.outputs.coverage_mode != 'skip'
        uses: ./.github/actions/setup-pnpm-workspace
      - name: Start Redis
        if: needs.scope.outputs.coverage_mode != 'skip'
        run: docker run -d --name sva-studio-redis-coverage -p 6379:6379 redis:7-alpine
      - name: Wait for Redis readiness
        if: needs.scope.outputs.coverage_mode != 'skip'
        run: |
          set -euo pipefail
          for i in {1..30}; do
            if docker exec sva-studio-redis-coverage redis-cli -p 6379 ping | grep -q PONG; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Run Coverage contract
        if: needs.scope.outputs.coverage_mode != 'skip'
        env:
          NX_BASE: ${{ github.event.pull_request.base.sha }}
          NX_HEAD: ${{ github.event.pull_request.head.sha }}
          NX_RUN_FULL: ${{ needs.scope.outputs.coverage_mode == 'full' && '1' || '0' }}
          COVERAGE_GATE_REQUIRE_SUMMARIES: ${{ needs.scope.outputs.coverage_mode == 'full' && '1' || '0' }}
        run: |
          pnpm test:coverage:affected
          pnpm sonar-new-code-gate --base=${{ github.event.pull_request.base.sha }}
          pnpm coverage-gate
      - name: Stop Redis
        if: always() && needs.scope.outputs.coverage_mode != 'skip'
        run: docker rm -f sva-studio-redis-coverage || true
      - name: Upload to Codecov
        if: always() && env.CODECOV_TOKEN != '' && needs.scope.outputs.coverage_mode != 'skip'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: ./apps/**/coverage/lcov.info,./packages/**/coverage/lcov.info
          disable_search: true
          fail_ci_if_error: false
          flags: unittests
          name: coverage-${{ github.run_id }}
      - name: Upload Coverage evidence
        if: always() && needs.scope.outputs.code_relevant == 'true' && needs.scope.outputs.coverage_mode != 'skip'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports-${{ github.run_id }}
          path: |
            **/coverage/coverage-summary.json
            **/coverage/lcov.info
            artifacts/ci-feedback/coverage-coverage-complete.json
            artifacts/ci-feedback/coverage-shards/*.json
            tooling/testing/coverage-policy.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  coverage-aggregate:
    name: Coverage
    if: always()
    needs:
      - scope
      - coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Coverage evidence validators
        uses: actions/checkout@v7
        with:
          filter: blob:none
          sparse-checkout: |
            .nvmrc
            scripts/ci
      - name: Setup aggregator Node.js runtime
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Download Coverage evidence
        if: needs.scope.outputs.code_relevant == 'true' && needs.scope.outputs.coverage_mode != 'skip'
        uses: actions/download-artifact@v8
        with:
          name: coverage-reports-${{ github.run_id }}
          path: artifacts/downloaded-coverage
      - name: Aggregate required Coverage status
        env:
          EVIDENCE_REQUIRED: ${{ needs.scope.outputs.code_relevant == 'true' && needs.scope.outputs.coverage_mode != 'skip' }}
          SCOPE_RESULT: ${{ needs.scope.result }}
          COMPLETE_RESULT: ${{ needs.coverage.result }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$SCOPE_RESULT" = "success"
          test "$COMPLETE_RESULT" = "success"
          if [ "$EVIDENCE_REQUIRED" != "true" ]; then
            exit 0
          fi
          node scripts/ci/ci-feedback-aggregate.ts \
            --gate coverage \
            --head "$HEAD_SHA" \
            --expected coverage-complete \
            --evidence-dir artifacts/downloaded-coverage
          node scripts/ci/validate-downloaded-coverage.ts artifacts/downloaded-coverage "$HEAD_SHA"

  complexity:
    name: Complexity
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0
      - name: Setup workspace
        if: needs.scope.outputs.quality_gate_mode != 'skip'
        uses: ./.github/actions/setup-pnpm-workspace
      - name: Run Complexity contract
        if: needs.scope.outputs.quality_gate_mode != 'skip'
        run: |
          if [ "${{ needs.scope.outputs.quality_gate_mode }}" = 'full' ]; then
            pnpm complexity-gate
          else
            pnpm complexity-gate --base ${{ github.event.pull_request.base.sha }}
          fi

  integration:
    name: PR Integration
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0
      - name: Setup workspace
        if: needs.scope.outputs.integration_mode != 'skip'
        uses: ./.github/actions/setup-pnpm-workspace
      - name: Run Integration contract
        if: needs.scope.outputs.integration_mode != 'skip'
        env:
          POSTGRES_PASSWORD: test-postgres-password
          APP_DB_USER: sva_app
          APP_DB_PASSWORD: test-app-password
          REDIS_PASSWORD: test-redis-password
          SVA_RUNTIME_PROFILE: studio
        run: |
          if [ "${{ needs.scope.outputs.integration_mode }}" = 'full' ]; then
            pnpm test:integration
          else
            pnpm exec tsx scripts/ci/run-integration-gate.ts --mode affected --base ${{ github.event.pull_request.base.sha }}
          fi

  file-placement:
    name: File Placement
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          filter: tree:0
      - name: Setup workspace
        uses: ./.github/actions/setup-pnpm-workspace
      - name: Run File Placement contract
        run: |
          pnpm check:file-placement
          pnpm check:rollout-docs

  a11y:
    name: A11y
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          filter: tree:0
      - name: Setup workspace
        if: needs.scope.outputs.a11y_mode != 'skip'
        uses: ./.github/actions/setup-pnpm-workspace
      - name: Run A11y contract
        if: needs.scope.outputs.a11y_mode != 'skip'
        run: pnpm test:a11y

  app-build:
    name: App Build
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0
      - name: Setup workspace
        if: needs.scope.outputs.app_build_mode != 'skip' || needs.scope.outputs.runtime_verify_mode != 'skip'
        uses: ./.github/actions/setup-pnpm-workspace
      - name: Run App Build contract
        if: needs.scope.outputs.app_build_mode != 'skip'
        run: pnpm nx run sva-studio-react:build
      - name: Run Runtime Artifact contract
        if: needs.scope.outputs.runtime_verify_mode != 'skip'
        run: pnpm verify:runtime-artifact

  documentation-integrity:
    name: Documentation Integrity
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          filter: tree:0
      - name: Setup workspace
        uses: ./.github/actions/setup-pnpm-workspace
      - name: Run Documentation Integrity contract
        run: pnpm check:docs

  documentation-catalog:
    name: Documentation Catalog (advisory)
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          filter: tree:0
      - name: Setup workspace
        if: needs.scope.outputs.documentation_catalog_mode != 'skip'
        uses: ./.github/actions/setup-pnpm-workspace
      - name: Diagnose Documentation Catalog contract
        if: needs.scope.outputs.documentation_catalog_mode != 'skip'
        continue-on-error: true
        run: pnpm nx run sva-studio-react:check:documentation-catalog

  db-schema:
    name: DB Schema Snapshot
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0
      - name: Setup workspace
        if: needs.scope.outputs.db_schema_mode != 'skip'
        uses: ./.github/actions/setup-pnpm-workspace
      - name: Run DB Schema Snapshot contract
        if: needs.scope.outputs.db_schema_mode != 'skip'
        run: pnpm exec tsx scripts/ci/check-db-schema-snapshot.ts
