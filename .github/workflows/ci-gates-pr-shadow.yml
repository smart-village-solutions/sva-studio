# Der Dateiname bleibt bis nach dem Cutover als Trigger-Anker bestehen, weil GitHub
# pull_request-Workflows vom Default-Branch registriert. Name und Verhalten sind produktiv.
name: CI Gates (PR)

concurrency:
  group: ci-gates-pr-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  scope:
    name: CI Scope
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      code_relevant: ${{ steps.scope.outputs.code_relevant }}
      quality_gate_mode: ${{ steps.scope.outputs.quality_gate_mode }}
      coverage_mode: ${{ steps.scope.outputs.coverage_mode }}
      integration_mode: ${{ steps.scope.outputs.integration_mode }}
      a11y_mode: ${{ steps.scope.outputs.a11y_mode }}
      runtime_verify_mode: ${{ steps.scope.outputs.runtime_verify_mode }}
      app_build_mode: ${{ steps.scope.outputs.app_build_mode }}
      documentation_catalog_mode: ${{ steps.scope.outputs.documentation_catalog_mode }}
      db_schema_mode: ${{ steps.scope.outputs.db_schema_mode }}
      coverage_priority_matrix: ${{ steps.scope.outputs.coverage_priority_matrix }}
      coverage_remaining_matrix: ${{ steps.scope.outputs.coverage_remaining_matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          filter: tree:0
          fetch-depth: 0

      - name: Setup Node.js runtime
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Determine canonical PR scope once
        id: scope
        run: >-
          node --no-warnings --experimental-strip-types scripts/ci/pr-scope.cli.ts
          --base ${{ github.event.pull_request.base.sha }}
          --head ${{ github.event.pull_request.head.sha }}
          --github-output
          --evidence-path artifacts/ci-gates/pr-scope.json

      - name: Upload canonical scope evidence
        uses: actions/upload-artifact@v7
        with:
          name: ci-gate-scope-${{ github.run_id }}
          path: artifacts/ci-gates/pr-scope.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  lint:
    name: Lint
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          filter: tree:0
          fetch-depth: 0
      - name: Setup workspace
        if: needs.scope.outputs.quality_gate_mode != 'skip'
        uses: ./.github/actions/setup-pnpm-workspace
      - name: Run lint contract
        if: needs.scope.outputs.quality_gate_mode != 'skip'
        env:
          NX_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ needs.scope.outputs.quality_gate_mode }}" = 'full' ]; then
            pnpm test:eslint
          else
            pnpm test:eslint:affected
          fi

  unit-direct:
    name: Unit Fast Feedback
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          filter: tree:0
          fetch-depth: 0
      - name: Setup workspace
        if: needs.scope.outputs.quality_gate_mode != 'skip'
        uses: ./.github/actions/setup-pnpm-workspace
      - name: Run direct Unit phase
        if: needs.scope.outputs.quality_gate_mode != 'skip'
        env:
          NX_BASE: ${{ github.event.pull_request.base.sha }}
          CI_UNIT_APP_SEPARATE: '1'
          NX_HEAD: ${{ github.event.pull_request.head.sha }}
          NX_RUN_FULL: ${{ needs.scope.outputs.quality_gate_mode == 'full' && '1' || '0' }}
        run: pnpm test:unit:affected --phase direct
      - name: Upload direct Unit evidence
        if: always() && needs.scope.outputs.code_relevant == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: unit-feedback-direct-${{ github.run_id }}
          path: artifacts/ci-feedback/unit-unit-direct.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  unit-remaining:
    name: Unit Complete (${{ matrix.shard }}/4)
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          filter: tree:0
          fetch-depth: 0
      - name: Setup workspace
        if: needs.scope.outputs.quality_gate_mode != 'skip'
        uses: ./.github/actions/setup-pnpm-workspace
      - name: Run remaining Unit phase
        if: needs.scope.outputs.quality_gate_mode != 'skip'
        env:
          NX_BASE: ${{ github.event.pull_request.base.sha }}
          CI_UNIT_APP_SEPARATE: '1'
          NX_HEAD: ${{ github.event.pull_request.head.sha }}
          NX_RUN_FULL: ${{ needs.scope.outputs.quality_gate_mode == 'full' && '1' || '0' }}
        run: pnpm test:unit:affected --phase remaining --shard ${{ matrix.shard }}/4
      - name: Upload remaining Unit evidence
        if: always() && needs.scope.outputs.code_relevant == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: unit-feedback-remaining-${{ matrix.shard }}-of-4-${{ github.run_id }}
          path: artifacts/ci-feedback/unit-unit-remaining-${{ matrix.shard }}-of-4.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  unit-app:
    name: App Unit (${{ matrix.partition }})
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        partition: [ui, hooks, server, routes-1, routes-2, routes-3, routes-4]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          filter: tree:0
          fetch-depth: 0
      - name: Setup workspace
        if: needs.scope.outputs.quality_gate_mode != 'skip'
        uses: ./.github/actions/setup-pnpm-workspace
      - name: Run isolated App Unit partition
        if: needs.scope.outputs.quality_gate_mode != 'skip'
        env:
          NX_BASE: ${{ github.event.pull_request.base.sha }}
          NX_HEAD: ${{ github.event.pull_request.head.sha }}
          NX_RUN_FULL: ${{ needs.scope.outputs.quality_gate_mode == 'full' && '1' || '0' }}
          CI_UNIT_APP_SEPARATE: '1'
        run: pnpm test:unit:affected --phase app --app-job ${{ matrix.partition }}
      - name: Upload App Unit evidence
        if: always() && needs.scope.outputs.code_relevant == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: unit-feedback-app-${{ matrix.partition }}-${{ github.run_id }}
          path: artifacts/ci-feedback/unit-unit-app-${{ matrix.partition }}.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  unit:
    name: Unit
    if: always()
    needs:
      - scope
      - unit-direct
      - unit-remaining
      - unit-app
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Unit evidence validator
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          filter: blob:none
          sparse-checkout: |
            .nvmrc
            scripts/ci
      - name: Setup aggregator Node.js runtime
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Download Unit evidence
        if: needs.scope.outputs.code_relevant == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: unit-feedback-*-${{ github.run_id }}
          path: artifacts/downloaded-unit-feedback
          merge-multiple: true
      - name: Aggregate required Unit status
        env:
          EVIDENCE_REQUIRED: ${{ needs.scope.outputs.code_relevant }}
          SCOPE_RESULT: ${{ needs.scope.result }}
          DIRECT_RESULT: ${{ needs.unit-direct.result }}
          APP_RESULT: ${{ needs.unit-app.result }}
          REMAINING_RESULT: ${{ needs.unit-remaining.result }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$SCOPE_RESULT" = "success"
          test "$DIRECT_RESULT" = "success"
          test "$REMAINING_RESULT" = "success"
          test "$APP_RESULT" = "success"
          if [ "$EVIDENCE_REQUIRED" != "true" ]; then
            exit 0
          fi
          node scripts/ci/ci-feedback-aggregate.ts \
            --gate unit \
            --head "$HEAD_SHA" \
            --base "${{ github.event.pull_request.base.sha }}" \
            --expected unit-direct,unit-remaining-1-of-4,unit-remaining-2-of-4,unit-remaining-3-of-4,unit-remaining-4-of-4,unit-app-ui,unit-app-hooks,unit-app-server,unit-app-routes-1,unit-app-routes-2,unit-app-routes-3,unit-app-routes-4 \
            --evidence-dir artifacts/downloaded-unit-feedback

  types:
    name: Types
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          filter: tree:0
          fetch-depth: 0
      - name: Setup workspace
        if: needs.scope.outputs.quality_gate_mode != 'skip'
        uses: ./.github/actions/setup-pnpm-workspace
      - name: Run Types contract
        if: needs.scope.outputs.quality_gate_mode != 'skip'
        env:
          NX_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ needs.scope.outputs.quality_gate_mode }}" = 'full' ]; then
            pnpm test:types
          else
            pnpm test:types:affected
          fi

  coverage-priority:
    name: Coverage Priority (${{ matrix.partition }})
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        partition: ${{ fromJSON(needs.scope.outputs.coverage_priority_matrix) }}
    env:
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          filter: tree:0
          fetch-depth: 0
      - name: Setup workspace
        if: needs.scope.outputs.coverage_mode != 'skip'
        uses: ./.github/actions/setup-pnpm-workspace
      - name: Start Redis
        if: needs.scope.outputs.coverage_mode != 'skip'
        run: docker run -d --name sva-studio-redis-coverage -p 6379:6379 redis:7-alpine
      - name: Wait for Redis readiness
        if: needs.scope.outputs.coverage_mode != 'skip'
        run: |
          for i in {1..30}; do
            if docker exec sva-studio-redis-coverage redis-cli ping | grep -q PONG; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Run Coverage partition
        if: needs.scope.outputs.coverage_mode != 'skip'
        env:
          NX_BASE: ${{ github.event.pull_request.base.sha }}
          NX_HEAD: ${{ github.event.pull_request.head.sha }}
          NX_RUN_FULL: ${{ needs.scope.outputs.coverage_mode == 'full' && '1' || '0' }}
        run: pnpm test:coverage:affected --partition ${{ matrix.partition }}
      - name: Upload partition reports
        if: always() && needs.scope.outputs.coverage_mode != 'skip'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-partition-${{ matrix.partition }}
          path: |
            apps/*/coverage/**
            packages/*/coverage/**
            artifacts/ci-feedback/coverage-partitions/${{ matrix.partition }}.json
            artifacts/ci-feedback/coverage-coverage-${{ matrix.partition }}.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Stop Redis
        if: always() && needs.scope.outputs.coverage_mode != 'skip'
        run: docker rm -f sva-studio-redis-coverage || true

  coverage-remaining:
    name: Coverage Remaining (${{ matrix.partition }})
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        partition: ${{ fromJSON(needs.scope.outputs.coverage_remaining_matrix) }}
    env:
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          filter: tree:0
          fetch-depth: 0
      - name: Setup workspace
        if: needs.scope.outputs.coverage_mode != 'skip'
        uses: ./.github/actions/setup-pnpm-workspace
      - name: Start Redis
        if: needs.scope.outputs.coverage_mode != 'skip'
        run: docker run -d --name sva-studio-redis-coverage -p 6379:6379 redis:7-alpine
      - name: Wait for Redis readiness
        if: needs.scope.outputs.coverage_mode != 'skip'
        run: |
          for i in {1..30}; do
            if docker exec sva-studio-redis-coverage redis-cli ping | grep -q PONG; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Run Coverage partition
        if: needs.scope.outputs.coverage_mode != 'skip'
        env:
          NX_BASE: ${{ github.event.pull_request.base.sha }}
          NX_HEAD: ${{ github.event.pull_request.head.sha }}
          NX_RUN_FULL: ${{ needs.scope.outputs.coverage_mode == 'full' && '1' || '0' }}
        run: pnpm test:coverage:affected --partition ${{ matrix.partition }}
      - name: Upload partition reports
        if: always() && needs.scope.outputs.coverage_mode != 'skip'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-partition-${{ matrix.partition }}
          path: |
            apps/*/coverage/**
            packages/*/coverage/**
            artifacts/ci-feedback/coverage-partitions/${{ matrix.partition }}.json
            artifacts/ci-feedback/coverage-coverage-${{ matrix.partition }}.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Stop Redis
        if: always() && needs.scope.outputs.coverage_mode != 'skip'
        run: docker rm -f sva-studio-redis-coverage || true

  coverage-early:
    name: Changed Code Coverage
    needs: [scope, coverage-priority]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-pnpm-workspace
        if: needs.scope.outputs.coverage_mode != 'skip'
      - uses: actions/download-artifact@v8
        if: needs.scope.outputs.coverage_mode != 'skip'
        with:
          pattern: coverage-partition-*
          path: artifacts/downloaded-coverage-parts
      - name: Evaluate changed code as soon as priority reports are complete
        if: needs.scope.outputs.coverage_mode != 'skip'
        env:
          NX_RUN_FULL: ${{ needs.scope.outputs.coverage_mode == 'full' && '1' || '0' }}
        run: |
          pnpm exec tsx scripts/ci/affected-coverage-gate.ts --base ${{ github.event.pull_request.base.sha }} --head ${{ github.event.pull_request.head.sha }} --merge-partitions artifacts/downloaded-coverage-parts --priority-only
          pnpm sonar-new-code-gate --base=${{ github.event.pull_request.base.sha }}

  coverage:
    name: Coverage Complete
    if: always()
    needs: [scope, coverage-priority, coverage-remaining, coverage-early]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - name: Require successful complete partition execution
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          PRIORITY_RESULT: ${{ needs.coverage-priority.result }}
          REMAINING_RESULT: ${{ needs.coverage-remaining.result }}
          EARLY_RESULT: ${{ needs.coverage-early.result }}
        run: |
          test "$SCOPE_RESULT" = success
          test "$PRIORITY_RESULT" = success
          test "$REMAINING_RESULT" = success
          test "$EARLY_RESULT" = success
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-pnpm-workspace
        if: needs.scope.outputs.coverage_mode != 'skip'
      - uses: actions/download-artifact@v8
        if: needs.scope.outputs.coverage_mode != 'skip'
        with:
          pattern: coverage-partition-*
          path: artifacts/downloaded-coverage-parts
      - name: Merge and evaluate the full Coverage contract
        if: needs.scope.outputs.coverage_mode != 'skip'
        env:
          NX_RUN_FULL: ${{ needs.scope.outputs.coverage_mode == 'full' && '1' || '0' }}
          COVERAGE_GATE_REQUIRE_SUMMARIES: ${{ needs.scope.outputs.coverage_mode == 'full' && '1' || '0' }}
        run: |
          pnpm exec tsx scripts/ci/affected-coverage-gate.ts --base ${{ github.event.pull_request.base.sha }} --head ${{ github.event.pull_request.head.sha }} --merge-partitions artifacts/downloaded-coverage-parts
          pnpm sonar-new-code-gate --base=${{ github.event.pull_request.base.sha }}
          pnpm coverage-gate
      - name: Upload to Codecov
        if: always() && env.CODECOV_TOKEN != '' && needs.scope.outputs.coverage_mode != 'skip'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: ./apps/**/coverage/lcov.info,./packages/**/coverage/lcov.info
          disable_search: true
          fail_ci_if_error: false
          flags: unittests
          name: coverage-${{ github.run_id }}
      - name: Upload Coverage evidence
        if: always() && needs.scope.outputs.coverage_mode != 'skip'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports-${{ github.run_id }}
          path: |
            apps/*/coverage/coverage-summary.json
            apps/*/coverage/lcov.info
            packages/*/coverage/coverage-summary.json
            packages/*/coverage/lcov.info
            artifacts/ci-feedback/coverage-coverage-complete.json
            artifacts/ci-feedback/coverage-shards/*.json
            tooling/testing/coverage-policy.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  coverage-aggregate:
    name: Coverage
    if: always()
    needs:
      - scope
      - coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Coverage evidence validators
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          filter: blob:none
          sparse-checkout: |
            .nvmrc
            scripts/ci
      - name: Setup aggregator Node.js runtime
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Download Coverage evidence
        if: needs.scope.outputs.code_relevant == 'true' && needs.scope.outputs.coverage_mode != 'skip'
        uses: actions/download-artifact@v8
        with:
          name: coverage-reports-${{ github.run_id }}
          path: artifacts/downloaded-coverage
      - name: Aggregate required Coverage status
        env:
          EVIDENCE_REQUIRED: ${{ needs.scope.outputs.code_relevant == 'true' && needs.scope.outputs.coverage_mode != 'skip' }}
          SCOPE_RESULT: ${{ needs.scope.result }}
          COMPLETE_RESULT: ${{ needs.coverage.result }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$SCOPE_RESULT" = "success"
          test "$COMPLETE_RESULT" = "success"
          if [ "$EVIDENCE_REQUIRED" != "true" ]; then
            exit 0
          fi
          node scripts/ci/ci-feedback-aggregate.ts \
            --gate coverage \
            --head "$HEAD_SHA" \
            --base "${{ github.event.pull_request.base.sha }}" \
            --expected coverage-complete \
            --evidence-dir artifacts/downloaded-coverage
          node scripts/ci/validate-downloaded-coverage.ts artifacts/downloaded-coverage "$HEAD_SHA"

  complexity:
    name: Complexity
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          filter: tree:0
          fetch-depth: 0
      - name: Setup workspace
        if: needs.scope.outputs.quality_gate_mode != 'skip'
        uses: ./.github/actions/setup-pnpm-workspace
      - name: Run Complexity contract
        if: needs.scope.outputs.quality_gate_mode != 'skip'
        run: |
          if [ "${{ needs.scope.outputs.quality_gate_mode }}" = 'full' ]; then
            pnpm complexity-gate
          else
            pnpm complexity-gate --base ${{ github.event.pull_request.base.sha }}
          fi

  integration-execution:
    name: Integration Tests
    needs: scope
    if: needs.scope.result == 'success' && needs.scope.outputs.integration_mode != 'skip'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          filter: tree:0
          fetch-depth: 0
      - name: Setup workspace
        uses: ./.github/actions/setup-pnpm-workspace
      - name: Run Integration contract
        env:
          POSTGRES_PASSWORD: test-postgres-password
          APP_DB_USER: sva_app
          APP_DB_PASSWORD: test-app-password
          REDIS_PASSWORD: test-redis-password
          SVA_RUNTIME_PROFILE: studio
        run: |
          if [ "${{ needs.scope.outputs.integration_mode }}" = 'full' ]; then
            pnpm test:integration
          else
            pnpm exec tsx scripts/ci/run-integration-gate.ts --mode affected --base ${{ github.event.pull_request.base.sha }}
          fi

  integration:
    name: PR Integration
    needs: [scope, integration-execution, plugin-compatibility]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce Integration and relevant plugin compatibility
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          INTEGRATION_MODE: ${{ needs.scope.outputs.integration_mode }}
          EXECUTION_RESULT: ${{ needs.integration-execution.result }}
          PLUGIN_REQUIRED: ${{ needs.scope.outputs.app_build_mode != 'skip' || needs.scope.outputs.runtime_verify_mode != 'skip' || needs.scope.outputs.quality_gate_mode != 'skip' }}
          PLUGIN_RESULT: ${{ needs.plugin-compatibility.result }}
        run: |
          set -euo pipefail
          test "$SCOPE_RESULT" = "success"
          if [ "$INTEGRATION_MODE" = "skip" ]; then
            test "$EXECUTION_RESULT" = "skipped"
          else
            test "$EXECUTION_RESULT" = "success"
          fi
          if [ "$PLUGIN_REQUIRED" = "true" ]; then
            test "$PLUGIN_RESULT" = "success"
          else
            test "$PLUGIN_RESULT" = "success" || test "$PLUGIN_RESULT" = "skipped"
          fi

  file-placement:
    name: File Placement
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          filter: tree:0
      - name: Setup workspace
        uses: ./.github/actions/setup-pnpm-workspace
      - name: Run File Placement contract
        run: |
          pnpm check:file-placement
          pnpm check:rollout-docs

  a11y:
    name: A11y
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          filter: tree:0
      - name: Setup workspace
        if: needs.scope.outputs.a11y_mode != 'skip'
        uses: ./.github/actions/setup-pnpm-workspace
      - name: Run A11y contract
        if: needs.scope.outputs.a11y_mode != 'skip'
        run: pnpm test:a11y

  app-build:
    name: App Build
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          filter: tree:0
          fetch-depth: 0
      - name: Setup workspace
        if: needs.scope.outputs.app_build_mode != 'skip' || needs.scope.outputs.runtime_verify_mode != 'skip'
        uses: ./.github/actions/setup-pnpm-workspace
      - name: Run App Build contract
        if: needs.scope.outputs.app_build_mode != 'skip'
        run: pnpm nx run sva-studio-react:build
      - name: Run Runtime Artifact contract
        if: needs.scope.outputs.runtime_verify_mode != 'skip'
        run: pnpm verify:runtime-artifact

  documentation-integrity:
    name: Documentation Integrity
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          filter: tree:0
      - name: Setup workspace
        uses: ./.github/actions/setup-pnpm-workspace
      - name: Run Documentation Integrity contract
        run: pnpm check:docs

  documentation-catalog:
    name: Documentation Catalog (advisory)
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          filter: tree:0
      - name: Setup workspace
        if: needs.scope.outputs.documentation_catalog_mode != 'skip'
        uses: ./.github/actions/setup-pnpm-workspace
      - name: Diagnose Documentation Catalog contract
        if: needs.scope.outputs.documentation_catalog_mode != 'skip'
        continue-on-error: true
        run: pnpm nx run sva-studio-react:check:documentation-catalog

  db-schema:
    name: DB Schema Snapshot
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          filter: tree:0
          fetch-depth: 0
      - name: Setup workspace
        if: needs.scope.outputs.db_schema_mode != 'skip'
        uses: ./.github/actions/setup-pnpm-workspace
      - name: Run DB Schema Snapshot contract
        if: needs.scope.outputs.db_schema_mode != 'skip'
        run: pnpm exec tsx scripts/ci/check-db-schema-snapshot.ts

  plugin-compatibility:
    name: Plugin Reference
    needs: scope
    if: needs.scope.outputs.app_build_mode != 'skip' || needs.scope.outputs.runtime_verify_mode != 'skip' || needs.scope.outputs.quality_gate_mode != 'skip'
    permissions:
      contents: read
      id-token: write
    uses: smart-village-solutions/sva-studio_plugin-application-overview/.github/workflows/quality.yml@99dff774e363ded3efe64f4bb830cdcd44ea648e
    with:
      plugin-ref: 99dff774e363ded3efe64f4bb830cdcd44ea648e
      studio-ref: ${{ github.event.pull_request.head.sha }}
