name: Promote
run-name: Promote ${{ inputs.image_ref }} to ${{ inputs.environment }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options: [dev, staging, prod]
      image_ref:
        description: 'Image tag, digest, or full image ref'
        required: true
        default: latest
      migration_mode:
        description: 'Migration gate mode'
        required: true
        default: assert-none
        type: choice
        options: [assert-none, auto, run]
      bootstrap_mode:
        description: 'Bootstrap gate mode'
        required: true
        default: assert-none
        type: choice
        options: [assert-none, auto, run]
      change_base:
        description: 'Git base ref represented by the promoted image'
        required: true
      change_head:
        description: 'Git head ref represented by the promoted image'
        required: true
      promote_mode:
        description: 'Promote mode'
        required: true
        default: standard
        type: choice
        options: [standard, recovery]
      recovery_reason:
        description: 'Required documented reason for recovery mode'
        required: false
        type: string
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      image_ref:
        required: true
        type: string
      migration_mode:
        required: false
        type: string
        default: assert-none
      bootstrap_mode:
        required: false
        type: string
        default: assert-none
      change_base:
        required: true
        type: string
      change_head:
        required: true
        type: string
      promote_mode:
        required: false
        type: string
        default: standard
      recovery_reason:
        required: false
        type: string
        default: ''

permissions:
  actions: read
  contents: read
  id-token: write
  packages: read

concurrency:
  group: promote-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy ${{ inputs.environment }}
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    steps:
      - name: initialize promote controller paths
        run: |
          set -euo pipefail
          {
            echo "PROMOTE_FAILURE_PATH=${RUNNER_TEMP}/promote-terminal-failure.json"
            echo "PROMOTE_CONTROLLER_DIR=${RUNNER_TEMP}/promote-evidence-controller"
          } >> "${GITHUB_ENV}"

      - name: checkout workflow controller revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.workflow_sha }}

      - name: setup finalizer Node.js runtime
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: preserve promote evidence controller
        run: |
          set -euo pipefail
          mkdir -p "${PROMOTE_CONTROLLER_DIR}"
          cp scripts/ci/promote-result.ts "${PROMOTE_CONTROLLER_DIR}/promote-result.ts"
          cp scripts/ci/promote-evidence.ts "${PROMOTE_CONTROLLER_DIR}/promote-evidence.ts"
          cp scripts/ci/promote-evidence-contract.ts "${PROMOTE_CONTROLLER_DIR}/promote-evidence-contract.ts"
          cp scripts/ci/promote-evidence-io.ts "${PROMOTE_CONTROLLER_DIR}/promote-evidence-io.ts"
          cp scripts/ci/promote-evidence-types.ts "${PROMOTE_CONTROLLER_DIR}/promote-evidence-types.ts"
          cp scripts/ci/app-e2e-evidence.ts "${PROMOTE_CONTROLLER_DIR}/app-e2e-evidence.ts"
          cp scripts/ci/verify-main-e2e-evidence.ts "${PROMOTE_CONTROLLER_DIR}/verify-main-e2e-evidence.ts"
          cp scripts/ci/verify-staging-promote-evidence.ts "${PROMOTE_CONTROLLER_DIR}/verify-staging-promote-evidence.ts"
          cp scripts/ci/write-staging-promote-evidence.ts "${PROMOTE_CONTROLLER_DIR}/write-staging-promote-evidence.ts"
          cp scripts/ci/record-promote-failure.ts "${PROMOTE_CONTROLLER_DIR}/record-promote-failure.ts"
          cp scripts/ci/write-promote-evidence.ts "${PROMOTE_CONTROLLER_DIR}/write-promote-evidence.ts"

      - name: validate inputs
        id: input_validation
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          IMAGE_INPUT: ${{ inputs.image_ref }}
          MIGRATION_MODE: ${{ inputs.migration_mode }}
          BOOTSTRAP_MODE: ${{ inputs.bootstrap_mode }}
          CHANGE_BASE: ${{ inputs.change_base }}
          CHANGE_HEAD: ${{ inputs.change_head }}
          PROMOTE_MODE: ${{ inputs.promote_mode }}
          RECOVERY_REASON: ${{ inputs.recovery_reason }}
        run: |
          set -euo pipefail
          record_input_failure() {
            node --experimental-strip-types "${PROMOTE_CONTROLLER_DIR}/record-promote-failure.ts" PROMOTE_INPUT_INVALID "${ENVIRONMENT}" input-validation
          }

          case "${ENVIRONMENT}" in
            dev|staging|prod) ;;
            *)
              record_input_failure
              exit 1
              ;;
          esac

          if [ -z "${IMAGE_INPUT}" ]; then
            record_input_failure
            exit 1
          fi

          if [ -z "${CHANGE_BASE}" ] || [ -z "${CHANGE_HEAD}" ]; then
            record_input_failure
            exit 1
          fi

          case "${MIGRATION_MODE}" in
            run|assert-none|auto) ;;
            *)
              record_input_failure
              exit 1
              ;;
          esac

          case "${BOOTSTRAP_MODE}" in
            run|assert-none|auto) ;;
            *)
              record_input_failure
              exit 1
              ;;
          esac

          case "${PROMOTE_MODE}" in
            standard) ;;
            recovery)
              if [ -z "${RECOVERY_REASON//[[:space:]]/}" ]; then
                node --experimental-strip-types "${PROMOTE_CONTROLLER_DIR}/record-promote-failure.ts" PROMOTE_RECOVERY_REASON_REQUIRED "${ENVIRONMENT}" input-validation
                exit 1
              fi
              ;;
            *)
              node --experimental-strip-types "${PROMOTE_CONTROLLER_DIR}/record-promote-failure.ts" PROMOTE_MODE_INVALID "${ENVIRONMENT}" input-validation
              exit 1
              ;;
          esac

      - name: validate permission snapshot secret
        id: permission_snapshot_secret
        env:
          REDIS_SNAPSHOT_HMAC_SECRET: ${{ secrets.REDIS_SNAPSHOT_HMAC_SECRET }}
        run: |
          set -euo pipefail

          trimmed_secret="${REDIS_SNAPSHOT_HMAC_SECRET#"${REDIS_SNAPSHOT_HMAC_SECRET%%[![:space:]]*}"}"
          trimmed_secret="${trimmed_secret%"${trimmed_secret##*[![:space:]]}"}"

          if [ "${#trimmed_secret}" -lt 32 ]; then
            node --experimental-strip-types "${PROMOTE_CONTROLLER_DIR}/record-promote-failure.ts" PROMOTE_PERMISSION_SNAPSHOT_SECRET_INVALID "${{ inputs.environment }}" input-validation
            exit 1
          fi

      - name: validate worker database secret
        id: worker_database_secret
        env:
          STUDIO_JOB_WORKER_DB_PASSWORD: ${{ secrets.STUDIO_JOB_WORKER_DB_PASSWORD }}
        run: |
          set -euo pipefail
          if [ "${#STUDIO_JOB_WORKER_DB_PASSWORD}" -lt 32 ]; then
            echo "::error::STUDIO_JOB_WORKER_DB_PASSWORD fehlt oder ist zu kurz." >&2
            node --experimental-strip-types "${PROMOTE_CONTROLLER_DIR}/record-promote-failure.ts" PROMOTE_CONFIG_REQUIRED_KEY_MISSING "${{ inputs.environment }}" input-validation
            exit 1
          fi

      - name: fetch main reference
        id: source_preparation
        run: git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main

      - name: bind executor source to promoted change head
        id: source_contract
        env:
          CHANGE_BASE: ${{ inputs.change_base }}
          CHANGE_HEAD: ${{ inputs.change_head }}
        run: |
          set -euo pipefail
          if ! base="$(git rev-parse --verify "${CHANGE_BASE}^{commit}")" ||
             ! head="$(git rev-parse --verify "${CHANGE_HEAD}^{commit}")" ||
             ! git merge-base --is-ancestor "${base}" "${head}"; then
            node --experimental-strip-types "${PROMOTE_CONTROLLER_DIR}/record-promote-failure.ts" PROMOTE_SOURCE_CONTRACT_INVALID "${{ inputs.environment }}" source-contract
            exit 1
          fi
          if ! git checkout --detach "${head}" || [ "$(git rev-parse HEAD)" != "${head}" ]; then
            node --experimental-strip-types "${PROMOTE_CONTROLLER_DIR}/record-promote-failure.ts" PROMOTE_SOURCE_CONTRACT_INVALID "${{ inputs.environment }}" source-contract
            exit 1
          fi
          {
            echo "base_sha=${base}"
            echo "head_sha=${head}"
          } >> "${GITHUB_OUTPUT}"

      - name: setup pnpm workspace for promoted source
        id: workspace_setup
        uses: ./.github/actions/setup-pnpm-workspace

      - name: Login to GHCR
        id: registry_login
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: validate image contract
        id: image_contract
        env:
          CHANGE_HEAD: ${{ inputs.change_head }}
          ENVIRONMENT: ${{ inputs.environment }}
          IMAGE_INPUT: ${{ inputs.image_ref }}
        run: |
          set -euo pipefail

          if ! pnpm exec tsx scripts/ci/promote-image-contract.ts \
            --environment "${ENVIRONMENT}" \
            --image "${IMAGE_INPUT}" \
            --expected-revision "$(git rev-parse --verify "${CHANGE_HEAD}^{commit}")"; then
            node --experimental-strip-types "${PROMOTE_CONTROLLER_DIR}/record-promote-failure.ts" PROMOTE_IMAGE_CONTRACT_INVALID "${ENVIRONMENT}" image-contract
            exit 1
          fi

      - name: require canonical Main App E2E evidence
        id: main_e2e_evidence
        if: ${{ inputs.environment == 'staging' && inputs.promote_mode == 'standard' && (vars.MAIN_E2E_GATE == 'shadow' || vars.MAIN_E2E_GATE == 'enforce') }}
        continue-on-error: ${{ vars.MAIN_E2E_GATE == 'shadow' }}
        env:
          EXPECTED_CHANGE_HEAD: ${{ steps.source_contract.outputs.head_sha }}
          GITHUB_TOKEN: ${{ github.token }}
          PROMOTE_FAILURE_PATH: ${{ vars.MAIN_E2E_GATE == 'enforce' && format('{0}/promote-terminal-failure.json', runner.temp) || '' }}
        run: pnpm exec tsx "${PROMOTE_CONTROLLER_DIR}/verify-main-e2e-evidence.ts"

      - name: build and select remote config
        id: remote_config
        env:
          APP_CONFIG: ${{ secrets.APP_CONFIG }}
          PROMOTE_CONFIG_OVERRIDES: ${{ secrets.PROMOTE_CONFIG_OVERRIDES }}
          PROMOTE_CONFIG_BUILDER_MODE: ${{ vars.PROMOTE_CONFIG_BUILDER_MODE }}
        run: |
          set -euo pipefail
          umask 077
          mode="${PROMOTE_CONFIG_BUILDER_MODE:-shadow}"
          case "${mode}" in
            shadow)
              if ! PROMOTE_FAILURE_PATH= pnpm exec tsx scripts/ci/build-remote-app-config.ts \
                  --environment "${{ inputs.environment }}" \
                  --profile "config/runtime/remote/${{ inputs.environment }}.vars" \
                  --output "${RUNNER_TEMP}/candidate-app-config.vars" \
                  --shadow; then
                echo "::warning::PROMOTE_CONFIG_SHADOW_MISMATCH: Der beobachtende Config-Builder konnte keinen gueltigen Candidate erzeugen."
              fi
              printf '%s\n' "${APP_CONFIG}" > "${RUNNER_TEMP}/promote-app-config.vars"
              ;;
            authoritative)
              pnpm exec tsx scripts/ci/build-remote-app-config.ts \
                --environment "${{ inputs.environment }}" \
                --profile "config/runtime/remote/${{ inputs.environment }}.vars" \
                --output "${RUNNER_TEMP}/promote-app-config.vars"
              ;;
            *)
              node --experimental-strip-types "${PROMOTE_CONTROLLER_DIR}/record-promote-failure.ts" PROMOTE_CONFIG_INVALID "${{ inputs.environment }}" config-build
              exit 1
              ;;
          esac
          echo "mode=${mode}" >> "${GITHUB_OUTPUT}"

      - name: inject worker database secret
        id: worker_database_secret_injection
        env:
          STUDIO_JOB_WORKER_DB_PASSWORD: ${{ secrets.STUDIO_JOB_WORKER_DB_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          if ! pnpm exec tsx scripts/ci/inject-worker-database-secret.ts \
            --input "${RUNNER_TEMP}/promote-app-config.vars"; then
            node --experimental-strip-types "${PROMOTE_CONTROLLER_DIR}/record-promote-failure.ts" PROMOTE_CONFIG_INVALID "${{ inputs.environment }}" config-build
            exit 1
          fi

      - name: setup quantum-cli
        id: deployment_tooling
        uses: hostwithquantum/setup-quantum-cli@v2.0.0
        with:
          api-key: ${{ secrets.QUANTUM_API_KEY }}
          version: 3.2.1

      - name: resolve deployment target
        id: target
        run: |
          if ! pnpm exec tsx scripts/ci/promote-target.ts "${{ inputs.environment }}"; then
            node --experimental-strip-types "${PROMOTE_CONTROLLER_DIR}/record-promote-failure.ts" PROMOTE_INPUT_INVALID "${{ inputs.environment }}" deploy
            exit 1
          fi

      - name: verify pre-mutation production readiness
        id: readiness
        env:
          PROMOTE_MODE: ${{ inputs.promote_mode }}
          RECOVERY_REASON: ${{ inputs.recovery_reason }}
          SVA_PUBLIC_BASE_URL: ${{ steps.target.outputs.public_base_url }}
        run: pnpm exec tsx scripts/ci/verify-promote-readiness.ts "${{ inputs.environment }}"

      - name: capture previous live app digest
        id: previous_live_image
        env:
          QUANTUM_ENDPOINT: ${{ vars.QUANTUM_ENDPOINT }}
        run: |
          if ! pnpm exec tsx scripts/ci/promote-live-digest.ts "${{ inputs.environment }}"; then
            node --experimental-strip-types "${PROMOTE_CONTROLLER_DIR}/record-promote-failure.ts" PROMOTE_INTERNAL_ERROR "${{ inputs.environment }}" digest-verification
            exit 1
          fi

      - name: bind deploy gates to actual live revision
        id: deployment_base
        run: |
          if ! pnpm exec tsx scripts/ci/promote-deployment-base.ts \
            --declared-base "${{ steps.source_contract.outputs.base_sha }}" \
            --head "${{ steps.source_contract.outputs.head_sha }}" \
            --live-image "${{ steps.previous_live_image.outputs.previous_live_image }}" \
            --environment "${{ inputs.environment }}"; then
            node --experimental-strip-types "${PROMOTE_CONTROLLER_DIR}/record-promote-failure.ts" PROMOTE_SOURCE_CONTRACT_INVALID "${{ inputs.environment }}" source-contract
            exit 1
          fi

      - name: evaluate migration and bootstrap gates
        id: gate_eval
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          CHANGE_BASE: ${{ steps.deployment_base.outputs.base_sha }}
          CHANGE_HEAD: ${{ steps.source_contract.outputs.head_sha }}
          MIGRATION_MODE: ${{ inputs.migration_mode }}
          BOOTSTRAP_MODE: ${{ inputs.bootstrap_mode }}
        run: |
          set -euo pipefail

          BASE_REF="${CHANGE_BASE}"
          HEAD_REF="${CHANGE_HEAD}"

          migration_executor_configured=true
          bootstrap_executor_configured=true

          echo "Evaluating deploy gates against ${BASE_REF}..${HEAD_REF}"
          if ! pnpm exec tsx scripts/ci/promote-deploy-gates.ts \
            --base "${BASE_REF}" \
            --head "${HEAD_REF}" \
            --environment "${ENVIRONMENT}" \
            --migration-mode "${MIGRATION_MODE}" \
            --bootstrap-mode "${BOOTSTRAP_MODE}" \
            --migration-executor-configured "${migration_executor_configured}" \
            --bootstrap-executor-configured "${bootstrap_executor_configured}"; then
            node --experimental-strip-types "${PROMOTE_CONTROLLER_DIR}/record-promote-failure.ts" PROMOTE_INTERNAL_ERROR "${ENVIRONMENT}" static-preflight
            exit 1
          fi

      - name: enforce migration and bootstrap gates
        id: migration_enforcement
        env:
          MIGRATION_MODE: ${{ inputs.migration_mode }}
          BOOTSTRAP_MODE: ${{ inputs.bootstrap_mode }}
          MIGRATION_GATE_OK: ${{ steps.gate_eval.outputs.migration_gate_ok }}
          MIGRATION_GATE_RESULT: ${{ steps.gate_eval.outputs.migration_gate_result }}
          MIGRATION_GATE_RISK_FILES: ${{ steps.gate_eval.outputs.migration_gate_risk_files }}
          MIGRATION_GATE_MESSAGE: ${{ steps.gate_eval.outputs.migration_gate_message }}
          BOOTSTRAP_GATE_OK: ${{ steps.gate_eval.outputs.bootstrap_gate_ok }}
          BOOTSTRAP_GATE_RESULT: ${{ steps.gate_eval.outputs.bootstrap_gate_result }}
          BOOTSTRAP_GATE_RISK_FILES: ${{ steps.gate_eval.outputs.bootstrap_gate_risk_files }}
          BOOTSTRAP_GATE_MESSAGE: ${{ steps.gate_eval.outputs.bootstrap_gate_message }}
        run: |
          set -euo pipefail

          if [ "${MIGRATION_GATE_OK}" != "true" ]; then
            node --experimental-strip-types "${PROMOTE_CONTROLLER_DIR}/record-promote-failure.ts" PROMOTE_DEPLOY_GATES_REJECTED "${{ inputs.environment }}" static-preflight
            exit 1
          fi

          if [ "${BOOTSTRAP_GATE_OK}" != "true" ]; then
            node --experimental-strip-types "${PROMOTE_CONTROLLER_DIR}/record-promote-failure.ts" PROMOTE_DEPLOY_GATES_REJECTED "${{ inputs.environment }}" static-preflight
            exit 1
          fi

      - name: require successful staging parity for production mutation
        id: staging_parity
        if: ${{ inputs.environment == 'prod' }}
        env:
          DEPLOY_IMAGE_DIGEST: ${{ steps.image_contract.outputs.deploy_summary_digest }}
          DEPLOY_IMAGE_REF: ${{ steps.image_contract.outputs.deploy_image_ref }}
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_CHANGE_HEAD: ${{ steps.source_contract.outputs.head_sha }}
          MAIN_E2E_GATE_MODE: ${{ vars.MAIN_E2E_GATE || 'disabled' }}
          PREVIOUS_LIVE_IMAGE: ${{ steps.previous_live_image.outputs.previous_live_image }}
        run: |
          if ! pnpm exec tsx "${PROMOTE_CONTROLLER_DIR}/verify-staging-promote-evidence.ts"; then
            exit 1
          fi

      - name: verify live backup agent capabilities
        id: backup_capabilities
        if: ${{ (inputs.environment == 'staging' || inputs.environment == 'prod') && vars.BACKUP_EXECUTOR != 'temporary' }}
        continue-on-error: ${{ vars.BACKUP_CAPABILITY_GATE != 'enforce' }}
        env:
          PROMOTE_FAILURE_PATH: ${{ vars.BACKUP_CAPABILITY_GATE == 'enforce' && format('{0}/promote-terminal-failure.json', runner.temp) || '' }}
          WASTE_POSTGRES_BACKUP_ENABLED: ${{ vars.WASTE_POSTGRES_BACKUP_ENABLED }}
        run: pnpm exec tsx scripts/ci/verify-backup-agent-capabilities.ts "${{ inputs.environment }}"

      - name: run read-only candidate preflight
        id: candidate_job
        continue-on-error: ${{ vars.CANDIDATE_PREFLIGHT_GATE != 'enforce' }}
        env:
          PROMOTE_FAILURE_PATH: ${{ vars.CANDIDATE_PREFLIGHT_GATE == 'enforce' && format('{0}/promote-terminal-failure.json', runner.temp) || '' }}
          QUANTUM_ENDPOINT: ${{ vars.QUANTUM_ENDPOINT }}
          SVA_DEPLOY_REVISION: ${{ steps.image_contract.outputs.deploy_revision }}
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f .env' EXIT
          pnpm exec tsx scripts/ci/render-compose-env.ts \
            --input "${RUNNER_TEMP}/promote-app-config.vars" \
            --output .env
          printf '\nIMAGE_REF=%s\n' "${{ steps.image_contract.outputs.deploy_image_ref }}" >> .env
          pnpm exec tsx scripts/ci/promote-one-shot-job.ts --kind candidate --environment "${{ inputs.environment }}"

      - name: create database backup before deployment
        id: backup_job
        if: ${{ (inputs.environment == 'staging' || inputs.environment == 'prod') && vars.BACKUP_EXECUTOR != 'temporary' }}
        env:
          BACKUP_AGENT_SIGNING_KEY: ${{ secrets.BACKUP_AGENT_SIGNING_KEY }}
          DEPLOY_IMAGE_DIGEST: ${{ steps.image_contract.outputs.deploy_summary_digest }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_ENDPOINT: https://fileserver.smart-village.app
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        run: pnpm exec tsx scripts/ci/submit-backup-agent-request.ts "${{ inputs.environment }}"

      - name: create Waste database backup before deployment
        id: waste_backup_job
        if: ${{ (inputs.environment == 'staging' || inputs.environment == 'prod') && vars.BACKUP_EXECUTOR != 'temporary' && vars.WASTE_POSTGRES_BACKUP_ENABLED == 'true' }}
        env:
          BACKUP_AGENT_SIGNING_KEY: ${{ secrets.BACKUP_AGENT_SIGNING_KEY }}
          DEPLOY_IMAGE_DIGEST: ${{ steps.image_contract.outputs.deploy_summary_digest }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_ENDPOINT: https://fileserver.smart-village.app
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        run: pnpm exec tsx scripts/ci/submit-backup-agent-request.ts "${{ inputs.environment }}" waste

      - name: create temporary database backup fallback
        id: backup_fallback_job
        if: ${{ (inputs.environment == 'staging' || inputs.environment == 'prod') && vars.BACKUP_EXECUTOR == 'temporary' }}
        env:
          APP_CONFIG: ${{ secrets.APP_CONFIG }}
          DEPLOY_IMAGE_DIGEST: ${{ steps.image_contract.outputs.deploy_summary_digest }}
          QUANTUM_ENDPOINT: ${{ vars.QUANTUM_ENDPOINT }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_ENDPOINT: https://fileserver.smart-village.app
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f .env' EXIT
          pnpm exec tsx scripts/ci/render-compose-env.ts --input "${RUNNER_TEMP}/promote-app-config.vars" --output .env
          printf '\nIMAGE_REF=%s\n' "${{ steps.image_contract.outputs.deploy_image_ref }}" >> .env
          pnpm exec tsx scripts/ci/promote-backup-job.ts "${{ inputs.environment }}"

      - name: verify database backup object
        id: backup_verification
        if: ${{ inputs.environment == 'staging' || inputs.environment == 'prod' }}
        env:
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_BUCKET: ${{ steps.backup_job.outputs.backup_bucket || steps.backup_fallback_job.outputs.backup_bucket }}
          S3_ENDPOINT: https://fileserver.smart-village.app
          S3_OBJECT_KEY: ${{ steps.backup_job.outputs.backup_object || steps.backup_fallback_job.outputs.backup_object }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        run: pnpm exec tsx scripts/ci/verify-promote-backup.ts

      - name: verify Waste database backup object
        id: waste_backup_verification
        if: ${{ (inputs.environment == 'staging' || inputs.environment == 'prod') && vars.BACKUP_EXECUTOR != 'temporary' && vars.WASTE_POSTGRES_BACKUP_ENABLED == 'true' }}
        env:
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_BUCKET: ${{ steps.waste_backup_job.outputs.waste_backup_bucket }}
          S3_ENDPOINT: https://fileserver.smart-village.app
          S3_OBJECT_KEY: ${{ steps.waste_backup_job.outputs.waste_backup_object }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        run: pnpm exec tsx scripts/ci/verify-promote-backup.ts

      - name: run migration one-shot job
        id: migration_job
        if: ${{ steps.gate_eval.outputs.migration_should_run == 'true' }}
        env:
          APP_CONFIG: ${{ secrets.APP_CONFIG }}
          QUANTUM_ENDPOINT: ${{ vars.QUANTUM_ENDPOINT }}
          SVA_DEPLOY_REVISION: ${{ steps.image_contract.outputs.deploy_revision }}
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f .env' EXIT
          pnpm exec tsx scripts/ci/render-compose-env.ts --input "${RUNNER_TEMP}/promote-app-config.vars" --output .env
          printf '\nIMAGE_REF=%s\n' "${{ steps.image_contract.outputs.deploy_image_ref }}" >> .env
          pnpm exec tsx scripts/ci/promote-one-shot-job.ts --kind migration --environment "${{ inputs.environment }}"

      - name: run bootstrap one-shot job
        id: bootstrap_job
        if: ${{ steps.gate_eval.outputs.bootstrap_should_run == 'true' }}
        env:
          APP_CONFIG: ${{ secrets.APP_CONFIG }}
          QUANTUM_ENDPOINT: ${{ vars.QUANTUM_ENDPOINT }}
          SVA_DEPLOY_REVISION: ${{ steps.image_contract.outputs.deploy_revision }}
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f .env' EXIT
          pnpm exec tsx scripts/ci/render-compose-env.ts --input "${RUNNER_TEMP}/promote-app-config.vars" --output .env
          printf '\nIMAGE_REF=%s\n' "${{ steps.image_contract.outputs.deploy_image_ref }}" >> .env
          pnpm exec tsx scripts/ci/promote-one-shot-job.ts --kind bootstrap --environment "${{ inputs.environment }}"

      - name: run one-shot postconditions
        id: postconditions
        if: ${{ (inputs.environment == 'staging' || inputs.environment == 'prod') && (steps.gate_eval.outputs.migration_should_run == 'true' || steps.gate_eval.outputs.bootstrap_should_run == 'true') }}
        env:
          APP_CONFIG: ${{ secrets.APP_CONFIG }}
          QUANTUM_ENDPOINT: ${{ vars.QUANTUM_ENDPOINT }}
          SVA_PUBLIC_BASE_URL: ${{ steps.target.outputs.public_base_url }}
          SVA_STACK_NAME: ${{ steps.target.outputs.stack_name }}
          SVA_ACCEPTANCE_RELEASE_MODE: ${{ inputs.environment == 'prod' && 'prod' || '' }}
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f .env config/runtime/base.vars config/runtime/studio.vars' EXIT
          pnpm exec tsx scripts/ci/render-compose-env.ts --input "${RUNNER_TEMP}/promote-app-config.vars" --output .env
          mkdir -p config/runtime
          cp "${RUNNER_TEMP}/promote-app-config.vars" config/runtime/base.vars
          : > config/runtime/studio.vars
          pnpm exec tsx scripts/ops/runtime-env.ts doctor studio

      - name: deploy
        id: deploy
        env:
          QUANTUM_ENDPOINT: ${{ vars.QUANTUM_ENDPOINT }}
          ENVIRONMENT: ${{ inputs.environment }}
          DEPLOY_IMAGE_REF: ${{ steps.image_contract.outputs.deploy_image_ref }}
          DEPLOY_REVISION: ${{ steps.image_contract.outputs.deploy_revision }}
          APP_CONFIG: ${{ secrets.APP_CONFIG }}
          REDIS_SNAPSHOT_HMAC_SECRET: ${{ secrets.REDIS_SNAPSHOT_HMAC_SECRET }}
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f .env stack.json stack.yaml' EXIT

          if [ -z "${QUANTUM_ENDPOINT}" ]; then
            node --experimental-strip-types "${PROMOTE_CONTROLLER_DIR}/record-promote-failure.ts" PROMOTE_INPUT_INVALID "${ENVIRONMENT}" deploy
            exit 1
          fi

          if [ ! -s "${RUNNER_TEMP}/promote-app-config.vars" ]; then
            node --experimental-strip-types "${PROMOTE_CONTROLLER_DIR}/record-promote-failure.ts" PROMOTE_CONFIG_REQUIRED_KEY_MISSING "${ENVIRONMENT}" deploy
            exit 1
          fi

          pnpm exec tsx scripts/ci/render-compose-env.ts --input "${RUNNER_TEMP}/promote-app-config.vars" --output .env
          {
            printf '\nIMAGE_REF=%s\n' "${DEPLOY_IMAGE_REF}"
            printf 'SVA_DEPLOY_REVISION=%s\n' "${DEPLOY_REVISION}"
          } >> .env
          docker compose -f compose.yaml -f ./deploy/compose.${ENVIRONMENT}.yaml config --no-normalize --format json > stack.json
          pnpm exec tsx scripts/ci/render-quantum-stack.ts --input stack.json --output stack.yaml

          quantum-cli stacks deploy -f stack.yaml --stack "${{ steps.target.outputs.stack_name }}" --endpoint "${QUANTUM_ENDPOINT}"

      - name: wait for terminal Swarm convergence
        id: swarm_convergence
        env:
          QUANTUM_ENDPOINT: ${{ vars.QUANTUM_ENDPOINT }}
        run: pnpm exec tsx scripts/ci/verify-swarm-convergence.ts "${{ inputs.environment }}"

      - name: verify deployed runtime
        id: runtime_smoke
        env:
          APP_CONFIG: ${{ secrets.APP_CONFIG }}
          QUANTUM_ENDPOINT: ${{ vars.QUANTUM_ENDPOINT }}
          SVA_PUBLIC_BASE_URL: ${{ steps.target.outputs.public_base_url }}
          SVA_STACK_NAME: ${{ steps.target.outputs.stack_name }}
          SVA_ACCEPTANCE_RELEASE_MODE: ${{ inputs.environment == 'prod' && 'prod' || '' }}
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f .env config/runtime/base.vars config/runtime/studio.vars "${RUNNER_TEMP}/runtime-smoke.stderr"' EXIT
          pnpm exec tsx scripts/ci/render-compose-env.ts --input "${RUNNER_TEMP}/promote-app-config.vars" --output .env
          mkdir -p config/runtime
          cp "${RUNNER_TEMP}/promote-app-config.vars" config/runtime/base.vars
          : > config/runtime/studio.vars
          if ! pnpm exec tsx scripts/ops/runtime-env.ts smoke studio 2>"${RUNNER_TEMP}/runtime-smoke.stderr"; then
            if [ ! -s "${PROMOTE_FAILURE_PATH}" ]; then
              node --experimental-strip-types "${PROMOTE_CONTROLLER_DIR}/record-promote-failure.ts" PROMOTE_INTERNAL_ERROR "${{ inputs.environment }}" external-smoke
            fi
            exit 1
          fi

      - name: verify deployed runtime image digest
        id: digest_verification
        env:
          QUANTUM_ENDPOINT: ${{ vars.QUANTUM_ENDPOINT }}
        run: |
          if ! pnpm exec tsx scripts/ci/promote-live-digest.ts "${{ inputs.environment }}" --expected "${{ steps.image_contract.outputs.deploy_image_ref }}"; then
            node --experimental-strip-types "${PROMOTE_CONTROLLER_DIR}/record-promote-failure.ts" PROMOTE_LIVE_DIGEST_MISMATCH "${{ inputs.environment }}" digest-verification
            exit 1
          fi

      - name: write staging parity evidence
        id: staging_evidence
        if: ${{ inputs.environment == 'staging' && success() }}
        env:
          DEPLOY_IMAGE_DIGEST: ${{ steps.image_contract.outputs.deploy_summary_digest }}
          CHANGE_HEAD_SHA: ${{ steps.source_contract.outputs.head_sha }}
          MAIN_E2E_ATTESTATION: ${{ steps.main_e2e_evidence.outputs.e2e_attestation }}
          MAIN_E2E_GATE_MODE: ${{ vars.MAIN_E2E_GATE || 'disabled' }}
          PROMOTE_MODE: ${{ inputs.promote_mode }}
          STAGING_MUTATION: ${{ steps.gate_eval.outputs.migration_should_run == 'true' || steps.gate_eval.outputs.bootstrap_should_run == 'true' }}
        run: pnpm exec tsx "${PROMOTE_CONTROLLER_DIR}/write-staging-promote-evidence.ts"

      - name: upload staging parity evidence
        id: staging_evidence_upload
        if: ${{ inputs.environment == 'staging' && success() }}
        uses: actions/upload-artifact@v4
        with:
          name: promote-staging-parity-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/promote-staging-parity-${{ github.run_id }}.json
          retention-days: 14

      - name: upload redacted one-shot evidence
        id: one_shot_evidence_upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promote-one-shot-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/promote-candidate-*.json
            ${{ runner.temp }}/promote-migration-*.json
            ${{ runner.temp }}/promote-bootstrap-*.json
            ${{ runner.temp }}/promote-backup-*.json
            ${{ runner.temp }}/promote-swarm-convergence-*.json
          if-no-files-found: ignore
          retention-days: 14

      - name: remove selected remote config
        id: config_cleanup
        if: always()
        run: rm -f "${RUNNER_TEMP}/candidate-app-config.vars" "${RUNNER_TEMP}/promote-app-config.vars"

      - name: write redacted promote evidence
        id: promote_evidence
        if: always()
        env:
          PROMOTE_ENVIRONMENT: ${{ inputs.environment }}
          PROMOTE_JOB_STATUS: ${{ job.status }}
          PROMOTE_BASE_REF: ${{ steps.deployment_base.outputs.base_sha || inputs.change_base }}
          PROMOTE_HEAD_REF: ${{ inputs.change_head }}
          PROMOTE_BASE_SHA: ${{ steps.deployment_base.outputs.base_sha || steps.source_contract.outputs.base_sha }}
          PROMOTE_HEAD_SHA: ${{ steps.source_contract.outputs.head_sha }}
          PROMOTE_PREVIOUS_IMAGE: ${{ steps.previous_live_image.outputs.previous_live_image }}
          PROMOTE_TARGET_IMAGE: ${{ steps.image_contract.outputs.deploy_summary_digest }}
          PROMOTE_IMAGE_REVISION: ${{ steps.image_contract.outputs.deploy_revision }}
          PROMOTE_CONFIG_REVISION: ${{ steps.remote_config.outputs.config_revision }}
          PROMOTE_SECRET_REFERENCES: ${{ steps.remote_config.outputs.secret_references }}
          PROMOTE_BACKUP_AGENT: ${{ steps.backup_capabilities.outputs.backup_agent }}
          PROMOTE_MAIN_E2E_REFERENCE: ${{ steps.main_e2e_evidence.outputs.e2e_attestation }}
          PROMOTE_GATE_WORKSPACE_SETUP: ${{ steps.workspace_setup.outcome }}
          PROMOTE_GATE_INPUT: ${{ steps.input_validation.outcome }}
          PROMOTE_GATE_PERMISSION_SECRET: ${{ steps.permission_snapshot_secret.outcome }}
          PROMOTE_GATE_WORKER_DATABASE_SECRET: ${{ steps.worker_database_secret.outcome }}
          PROMOTE_GATE_SOURCE_PREPARATION: ${{ steps.source_preparation.outcome }}
          PROMOTE_GATE_SOURCE: ${{ steps.source_contract.outcome }}
          PROMOTE_GATE_DEPLOYMENT_BASE: ${{ steps.deployment_base.outcome }}
          PROMOTE_GATE_REGISTRY_LOGIN: ${{ steps.registry_login.outcome }}
          PROMOTE_GATE_IMAGE: ${{ steps.image_contract.outcome }}
          PROMOTE_GATE_MAIN_E2E_EVIDENCE: ${{ steps.main_e2e_evidence.outcome }}
          PROMOTE_GATE_MAIN_E2E_EVIDENCE_BLOCKING: ${{ vars.MAIN_E2E_GATE == 'enforce' }}
          PROMOTE_GATE_CONFIG_BUILD: ${{ steps.remote_config.outcome }}
          PROMOTE_GATE_WORKER_DATABASE_SECRET_INJECTION: ${{ steps.worker_database_secret_injection.outcome }}
          PROMOTE_GATE_POLICY_EVALUATION: ${{ steps.gate_eval.outcome }}
          PROMOTE_GATE_STATIC_PREFLIGHT: ${{ steps.migration_enforcement.outcome }}
          PROMOTE_GATE_DEPLOYMENT_TOOLING: ${{ steps.deployment_tooling.outcome }}
          PROMOTE_GATE_TARGET: ${{ steps.target.outcome }}
          PROMOTE_GATE_READINESS: ${{ steps.readiness.outcome }}
          PROMOTE_GATE_PREVIOUS_LIVE: ${{ steps.previous_live_image.outcome }}
          PROMOTE_GATE_CANDIDATE_PREFLIGHT: ${{ steps.candidate_job.outcome }}
          PROMOTE_GATE_CANDIDATE_PREFLIGHT_BLOCKING: ${{ vars.CANDIDATE_PREFLIGHT_GATE == 'enforce' }}
          PROMOTE_GATE_STAGING_PARITY: ${{ steps.staging_parity.outcome }}
          PROMOTE_GATE_BACKUP_CAPABILITIES: ${{ steps.backup_capabilities.outcome }}
          PROMOTE_GATE_BACKUP_CAPABILITIES_BLOCKING: ${{ vars.BACKUP_CAPABILITY_GATE == 'enforce' }}
          PROMOTE_GATE_BACKUP_REQUEST: ${{ steps.backup_job.outcome }}
          PROMOTE_GATE_WASTE_BACKUP_REQUEST: ${{ steps.waste_backup_job.outcome }}
          PROMOTE_GATE_BACKUP_FALLBACK: ${{ steps.backup_fallback_job.outcome }}
          PROMOTE_GATE_BACKUP: ${{ steps.backup_verification.outcome }}
          PROMOTE_GATE_WASTE_BACKUP: ${{ steps.waste_backup_verification.outcome }}
          PROMOTE_GATE_MIGRATION: ${{ steps.migration_job.outcome }}
          PROMOTE_GATE_BOOTSTRAP: ${{ steps.bootstrap_job.outcome }}
          PROMOTE_GATE_POSTCONDITIONS: ${{ steps.postconditions.outcome }}
          PROMOTE_GATE_DEPLOY: ${{ steps.deploy.outcome }}
          PROMOTE_GATE_SWARM_CONVERGENCE: ${{ steps.swarm_convergence.outcome }}
          PROMOTE_GATE_EXTERNAL_SMOKE: ${{ steps.runtime_smoke.outcome }}
          PROMOTE_GATE_DIGEST_VERIFICATION: ${{ steps.digest_verification.outcome }}
          PROMOTE_GATE_STAGING_EVIDENCE: ${{ steps.staging_evidence.outcome }}
          PROMOTE_GATE_STAGING_EVIDENCE_UPLOAD: ${{ steps.staging_evidence_upload.outcome }}
          PROMOTE_GATE_ONE_SHOT_EVIDENCE_UPLOAD: ${{ steps.one_shot_evidence_upload.outcome }}
          PROMOTE_GATE_CONFIG_CLEANUP: ${{ steps.config_cleanup.outcome }}
        run: node --experimental-strip-types "${PROMOTE_CONTROLLER_DIR}/write-promote-evidence.ts"

      - name: upload redacted promote evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promote-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/promote-evidence-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: error
          retention-days: 14
