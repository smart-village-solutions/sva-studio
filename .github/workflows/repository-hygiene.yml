name: Repository Hygiene

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check-file-placement:
    name: File Placement
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          filter: tree:0

      - name: Setup workspace
        uses: ./.github/actions/setup-pnpm-workspace

      - name: Validate file placement
        run: pnpm check:file-placement

      - name: Validate canonical rollout documentation
        run: pnpm check:rollout-docs

      - name: Publish file placement summary
        if: always()
        run: |
          echo 'File-Placement-Gate abgeschlossen.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Validierung: `pnpm check:file-placement` und `pnpm check:rollout-docs`.' >> "$GITHUB_STEP_SUMMARY"

  check-documentation-catalog:
    name: Documentation Catalog (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          filter: tree:0

      - name: Detect documentation catalog relevant changes
        id: changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            relevant:
              - 'apps/sva-studio-react/plugin-catalog.json'
              - 'apps/sva-studio-react/project.json'
              - 'apps/sva-studio-react/src/lib/plugin-catalog-loader.ts'
              - 'apps/sva-studio-react/src/routing/admin-resources.ts'
              - 'packages/plugin-*/plugin.manifest.json'
              - 'packages/plugin-*/src/**'
              - 'packages/routing/src/**'
              - 'scripts/ci/generate-documentation-page-catalog.ts'
              - 'docs/user-documentation/page-catalog.json'
              - '.github/workflows/repository-hygiene.yml'

      - name: Setup workspace
        if: steps.changes.outputs.relevant == 'true'
        uses: ./.github/actions/setup-pnpm-workspace

      - name: Diagnose documentation catalog drift
        id: catalog
        if: steps.changes.outputs.relevant == 'true'
        continue-on-error: true
        run: pnpm nx run sva-studio-react:check:documentation-catalog

      - name: Publish documentation catalog summary
        if: always()
        env:
          CATALOG_OUTCOME: ${{ steps.catalog.outcome }}
          RELEVANT: ${{ steps.changes.outputs.relevant }}
        run: |
          if [ "$RELEVANT" != 'true' ]; then
            echo 'Dokumentationskatalog: keine relevanten Änderungen, die Diagnose endet als No-op.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$CATALOG_OUTCOME" != 'success' ]; then
            echo '::warning title=Dokumentationskatalog ist veraltet::Der Advisory-Check hat Katalogdrift erkannt. App-Build und Deployment bleiben davon unabhängig.'
            echo '### Dokumentationskatalog: Drift erkannt' >> "$GITHUB_STEP_SUMMARY"
            echo 'Diese Diagnose blockiert App-Build und Deployment bewusst nicht.' >> "$GITHUB_STEP_SUMMARY"
            echo 'Katalog aktualisieren: `pnpm nx run sva-studio-react:documentation-catalog`.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo 'Dokumentationskatalog: reproduzierbar und aktuell.' >> "$GITHUB_STEP_SUMMARY"

  check-db-schema-snapshot:
    name: DB Schema Snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0

      - name: Detect schema snapshot relevant changes
        id: changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            relevant:
              - 'packages/data/migrations/**'
              - 'docs/development/studio-db-schema-final.sql'
              - 'docs/development/studio-db-schema.md'
              - 'scripts/ci/check-db-schema-snapshot.ts'
              - 'scripts/ops/runtime/db-schema-snapshot.ts'
              - '.github/workflows/repository-hygiene.yml'

      - name: Setup workspace
        if: steps.changes.outputs.relevant == 'true'
        uses: ./.github/actions/setup-pnpm-workspace

      - name: Validate DB schema snapshot
        if: steps.changes.outputs.relevant == 'true'
        run: pnpm exec tsx scripts/ci/check-db-schema-snapshot.ts

      - name: Publish DB schema snapshot summary
        if: always()
        run: |
          echo 'DB-Schema-Snapshot-Gate abgeschlossen.' >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.changes.outputs.relevant }}" != "true" ]; then
            echo 'Scope: keine migrations-/snapshot-relevanten Aenderungen, das Gate endet bewusst als No-op-Erfolg.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo 'Validierung: migrationsbasierter Schema-Dump gegen `docs/development/studio-db-schema-final.sql`.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Aktivierungskriterium: blockierend nur solange die relevante Median-Mehrlast <= 2 Minuten bleibt.' >> "$GITHUB_STEP_SUMMARY"
