name: Wiki Sync

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'config/documentation/wiki-publication-paths.txt'
      - '.github/workflows/wiki-sync.yml'
      - '.github/actions/setup-pnpm-workspace/action.yml'
      - 'scripts/ci/build-wiki-publication.ts'
      - 'scripts/ci/check-documentation.ts'
      - 'scripts/ci/documentation-integrity*.ts'
      - 'scripts/ci/wiki-publication*.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-wiki:
    name: Sync Wiki
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v7

      - name: Require main source
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Die Wiki-Publikation darf nur vom Branch main gestartet werden." >&2
            exit 1
          fi

      - name: Setup pnpm workspace
        uses: ./.github/actions/setup-pnpm-workspace

      - name: Verify documentation publication
        run: pnpm check:docs

      - name: Clone wiki repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WIKI_SYNC_TOKEN: ${{ secrets.WIKI_SYNC_TOKEN }}
        run: |
          set -euo pipefail

          TOKEN="${WIKI_SYNC_TOKEN:-$GITHUB_TOKEN}"
          WIKI_URL="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"

          if ! git clone --depth 1 "$WIKI_URL" wiki; then
            echo "Wiki clone failed."
            echo "Bitte pruefen:"
            echo "1) Wiki ist aktiviert und initialisiert (mindestens eine Seite vorhanden)."
            echo "2) Optionales Secret WIKI_SYNC_TOKEN hat repo-Rechte (empfohlen bei privaten Repos)."
            exit 1
          fi

      - name: Build rendered wiki publication
        run: pnpm exec tsx scripts/ci/build-wiki-publication.ts --output wiki

      - name: Commit and push wiki changes
        run: |
          if [[ -z "$(git -C wiki status --porcelain)" ]]; then
            echo "No wiki changes to commit."
            exit 0
          fi

          git -C wiki config user.name "github-actions[bot]"
          git -C wiki config user.email "github-actions[bot]@users.noreply.github.com"
          git -C wiki add .
          git -C wiki commit -m "docs: sync wiki from docs/ (${GITHUB_SHA::7})"
          git -C wiki push origin HEAD
