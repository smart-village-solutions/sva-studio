name: Wiki Sync

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'config/documentation/wiki-publication-paths.txt'
      - '.github/workflows/wiki-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-wiki:
    name: Sync Wiki
    runs-on: ubuntu-latest
    env:
      WIKI_SYNC_TOKEN: ${{ secrets.WIKI_SYNC_TOKEN }}

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v7

      - name: Clone wiki repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          TOKEN="${WIKI_SYNC_TOKEN:-$GITHUB_TOKEN}"
          WIKI_URL="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"

          if ! git clone --depth 1 "$WIKI_URL" wiki; then
            echo "Wiki clone failed."
            echo "Bitte pruefen:"
            echo "1) Wiki ist aktiviert und initialisiert (mindestens eine Seite vorhanden)."
            echo "2) Optionales Secret WIKI_SYNC_TOKEN hat repo-Rechte (empfohlen bei privaten Repos)."
            exit 1
          fi

      - name: Build curated documentation publication
        run: |
          set -euo pipefail

          publication_root="$(mktemp -d "${RUNNER_TEMP}/wiki-publication.XXXXXX")"
          publication_files="${RUNNER_TEMP}/wiki-publication-files"
          mapfile -t publication_pathspecs \
            < config/documentation/wiki-publication-paths.txt

          git ls-files -z -- "${publication_pathspecs[@]}" > "$publication_files"

          if [[ ! -s "$publication_files" ]]; then
            echo "Das Wiki-Publikationsmanifest hat keine Dateien ausgewählt." >&2
            exit 1
          fi

          rsync -aR --from0 --files-from="$publication_files" ./ "$publication_root/"

          if [[ ! -f "$publication_root/docs/README.md" ]]; then
            echo "Der kanonische Dokumentationseinstieg fehlt in der Wiki-Publikation." >&2
            exit 1
          fi

          mkdir -p wiki/docs
          rsync -a --delete "$publication_root/docs/" wiki/docs/

      - name: Generate wiki entry pages
        run: |
          cat > wiki/Home.md <<'EOF'
          # SVA Studio Wiki

          Diese Wiki-Inhalte werden automatisch aus `docs/` synchronisiert.

          ## Einstieg

          - [Dokumentationsübersicht](docs/README.md)
          - [Architekturübersicht (arc42)](docs/architecture/README.md)
          - [Architekturentscheidungen (ADRs)](docs/adr/README.md)
          - [Monorepo-Struktur](docs/monorepo.md)
          - [Routing](docs/routing.md)
          - [Monitoring-Stack](docs/development/monitoring-stack.md)
          - [Testing und Coverage Governance](docs/development/testing-coverage.md)
          EOF

          cat > wiki/_Sidebar.md <<'EOF'
          - [Home](Home)
          - [Dokumentationsübersicht](docs/README.md)
          - [Architektur (arc42)](docs/architecture/README.md)
          - [Architekturentscheidungen (ADRs)](docs/adr/README.md)
          - [Monorepo](docs/monorepo.md)
          - [Routing](docs/routing.md)
          - [Monitoring](docs/development/monitoring-stack.md)
          - [Testing/Coverage](docs/development/testing-coverage.md)
          EOF

      - name: Commit and push wiki changes
        run: |
          if [[ -z "$(git -C wiki status --porcelain)" ]]; then
            echo "No wiki changes to commit."
            exit 0
          fi

          git -C wiki config user.name "github-actions[bot]"
          git -C wiki config user.email "github-actions[bot]@users.noreply.github.com"
          git -C wiki add .
          git -C wiki commit -m "docs: sync wiki from docs/ (${GITHUB_SHA::7})"
          git -C wiki push origin HEAD
