  provisioner:
    image: ${IMAGE_REF}
    networks:
      - default
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == node-005.sva
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 5
        window: 120s
      resources:
        reservations:
          memory: 128M
        limits:
          memory: 256M

  migrate:
    image: ${IMAGE_REF}
    networks:
      - default
    deploy:
      replicas: 0
      placement:
        constraints:
          - node.hostname == node-005.sva
      restart_policy:
        condition: none
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 256M

  bootstrap:
    image: ${IMAGE_REF}
    networks:
      - default
    deploy:
      replicas: 0
      placement:
        constraints:
          - node.hostname == node-005.sva
      restart_policy:
        condition: none
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 256M

  redis:
    networks:
      - default
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == node-005.sva
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 60s
      resources:
        reservations:
          memory: 128M
        limits:
          memory: 256M

  postgres:
    networks:
      - default
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == node-005.sva
