services:
  app:
    image: ${IMAGE_REF}
    networks:
      - network-node-005
      - default
      - media-scan
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == node-005.sva
      restart_policy:
        condition: any
        delay: 5s
      resources:
        reservations:
          memory: 256M
        limits:
          memory: 512M
      labels:
        - 'sva.config.revision=${SVA_CONFIG_REVISION}'
        - 'traefik.docker.network=network-node-005'
        - 'traefik.enable=true'
        - 'traefik.frontend.passHostHeader=true'
        - 'traefik.frontend.rule=Host:studio-staging.smart-village.app,de-studio-sandbox.studio-staging.smart-village.app,readiness-smoke-20260927.studio-staging.smart-village.app'
        - 'traefik.port=3000'
        - 'traefik.http.routers.studio-staging-app.rule=Host(`studio-staging.smart-village.app`) || Host(`de-studio-sandbox.studio-staging.smart-village.app`) || Host(`readiness-smoke-20260927.studio-staging.smart-village.app`)'
        - 'traefik.http.routers.studio-staging-app.entrypoints=web,websecure'
        - 'traefik.http.routers.studio-staging-app.tls=true'
        - 'traefik.http.routers.studio-staging-app.tls.certresolver=default'
        - 'traefik.http.services.studio-staging-app.loadbalancer.server.port=3000'

  provisioner:
    image: ${IMAGE_REF}
    networks:
      - default
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: pause
      placement:
        constraints:
          - node.hostname == node-005.sva
      restart_policy:
        condition: any
        delay: 5s
      resources:
        reservations:
          memory: 128M
        limits:
          memory: 256M

  migrate:
    image: ${IMAGE_REF}
    networks:
      - default
    deploy:
      replicas: 0
      placement:
        constraints:
          - node.hostname == node-005.sva
      restart_policy:
        condition: none
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 256M

  bootstrap:
    image: ${IMAGE_REF}
    networks:
      - default
    deploy:
      replicas: 0
      placement:
        constraints:
          - node.hostname == node-005.sva
      restart_policy:
        condition: none
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 256M

  redis:
    # Cutover-Pin: entfernen, sobald compose.yaml denselben in Staging geprüften Digest festlegt.
    image: redis:7-alpine@sha256:892022f9f18c26c92c30e15194d132f90044af87b94a491a75429bbc3982eab1
    networks:
      - default
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == node-005.sva
      restart_policy:
        condition: any
        delay: 5s
      resources:
        reservations:
          memory: 128M
        limits:
          memory: 256M

  postgres:
    # Cutover-Pin: entfernen, sobald compose.yaml denselben in Staging geprüften Digest festlegt.
    image: postgres:16-alpine@sha256:deb28ee471183cb0c303113dac9b2433c51eeeeb678def7af9a9ec5820367815
    networks:
      - default
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == node-005.sva
      restart_policy:
        condition: any
        delay: 5s
      resources:
        reservations:
          memory: 256M
        limits:
          memory: 1G

networks:
  media-scan:
    external: true
    name: studio-clamav_default
  default:
  network-node-005:
    external: true

volumes:
  clamav-data:
    external: true
    name: studio-clamav-signatures
