# Prometheus Alert Rules
# Monitoring Stack Health + Resource Alerts

groups:
  - name: monitoring_stack_health
    interval: 30s
    rules:
      - alert: PrometheusCrash
        expr: up{job="prometheus"} == 0
        for: 5m
        labels:
          severity: critical
          component: prometheus
        annotations:
          summary: "Prometheus ist down"
          description: "Prometheus auf {{ $labels.instance }} ist seit {{ $value }} Minuten nicht erreichbar"

      - alert: LokiDown
        expr: up{job="loki"} == 0
        for: 5m
        labels:
          severity: critical
          component: loki
        annotations:
          summary: "Loki ist down"
          description: "Loki ist seit 5 Minuten nicht erreichbar. Logs werden nicht gesammelt."

      - alert: GrafanaDown
        expr: up{job="grafana"} == 0
        for: 5m
        labels:
          severity: warning
          component: grafana
        annotations:
          summary: "Grafana ist down"
          description: "Grafana ist nicht erreichbar. Dashboards sind offline."

      - alert: OTelCollectorDown
        expr: up{job="otel-collector"} == 0
        for: 2m
        labels:
          severity: critical
          component: otel-collector
        annotations:
          summary: "OTEL Collector ist down"
          description: "OTEL Collector ist offline. Metriken und Logs von der App werden nicht empfangen."

  - name: resource_usage_alerts
    interval: 1m
    rules:
      - alert: ContainerMemoryHigh
        expr: |
          (container_memory_usage_bytes / container_spec_memory_limit_bytes) > 0.80
        for: 2m
        labels:
          severity: warning
          component: "{{ $labels.name }}"
        annotations:
          summary: "Container Memory über 80%"
          description: "Container {{ $labels.name }} nutzt {{ $value | humanizePercentage }} seines Memory-Limits"

      - alert: ContainerMemoryCritical
        expr: |
          (container_memory_usage_bytes / container_spec_memory_limit_bytes) > 0.90
        for: 1m
        labels:
          severity: critical
          component: "{{ $labels.name }}"
        annotations:
          summary: "Container Memory über 90% - OOMKiller Risk!"
          description: "Container {{ $labels.name }} nutzt {{ $value | humanizePercentage }} seines Memory-Limits. OOMKiller droht!"

      - alert: PrometheusTSDBFull
        expr: |
          prometheus_tsdb_storage_blocks_bytes / (5 * 1024 * 1024 * 1024) > 0.85
        for: 10m
        labels:
          severity: warning
          component: prometheus
        annotations:
          summary: "Prometheus TSDB bei 85% Retention"
          description: "Prometheus TSDB nutzt {{ $value | humanizePercentage }} der 5GB Retention. Alte Daten werden bald gelöscht."

      - alert: LokiStorageLow
        expr: |
          loki_ingester_memory_chunks > 500
        for: 15m
        labels:
          severity: warning
          component: loki
        annotations:
          summary: "Loki hält viele Chunks im Speicher"
          description: "Loki hält {{ $value }} Chunks im Speicher. Möglicherweise zu viele Logs oder Disk I/O Problem."

  - name: scrape_health_alerts
    interval: 1m
    rules:
      - alert: PrometheusScrapeFailures
        expr: |
          up == 0
        for: 3m
        labels:
          severity: warning
          component: "{{ $labels.job }}"
        annotations:
          summary: "Prometheus kann {{ $labels.job }} nicht scrapen"
          description: "Job {{ $labels.job }} auf {{ $labels.instance }} ist seit 3 Minuten unreachable."

      - alert: PrometheusScrapeSlow
        expr: |
          scrape_duration_seconds > 10
        for: 5m
        labels:
          severity: warning
          component: "{{ $labels.job }}"
        annotations:
          summary: "Prometheus Scrape dauert zu lange"
          description: "Scrape von {{ $labels.job }} dauert {{ $value }}s (sollte < 10s sein)"

  - name: application_health_alerts
    interval: 1m
    rules:
      # TODO: Aktivieren sobald Application Metriken verfügbar sind

  - name: plugin_tenant_lifecycle_alerts
    interval: 15s
    rules:
      - alert: PluginTenantLifecycleLaneUnavailableWarning
        expr: |
          (min by (lane) (sva_plugin_tenant_lifecycle_lane_ready{lane=~"default|privileged"}) < 1)
          or absent(sva_plugin_tenant_lifecycle_lane_ready{lane="default"})
          or absent(sva_plugin_tenant_lifecycle_lane_ready{lane="privileged"})
        for: 15s
        labels:
          severity: warning
          component: plugin-tenant-lifecycle
        annotations:
          summary: "Plugin-Lifecycle-Lane ist nicht bereit"
          description: "Mindestens eine erforderliche Worker-Lane kann persistierte Plugin-Lifecycle-Arbeit nicht sicher verarbeiten."
          runbook_url: "https://github.com/smart-village-solutions/sva-studio/blob/main/docs/operations/plugin-tenant-lifecycle-operations.md"

      - alert: PluginTenantLifecycleLaneUnavailableCritical
        expr: |
          (min by (lane) (sva_plugin_tenant_lifecycle_lane_ready{lane=~"default|privileged"}) < 1)
          or absent(sva_plugin_tenant_lifecycle_lane_ready{lane="default"})
          or absent(sva_plugin_tenant_lifecycle_lane_ready{lane="privileged"})
        for: 30s
        labels:
          severity: critical
          component: plugin-tenant-lifecycle
        annotations:
          summary: "Plugin-Lifecycle-Lane ist ausgefallen"
          description: "Mindestens eine erforderliche Worker-Lane ist über das kritische Alarmfenster hinaus nicht bereit."
          runbook_url: "https://github.com/smart-village-solutions/sva-studio/blob/main/docs/operations/plugin-tenant-lifecycle-operations.md"

      - alert: PluginTenantLifecycleStaleClaimWarning
        expr: |
          max by (reason_code) (sva_plugin_tenant_lifecycle_stall_count{reason_code="stale_claim"}) > 0
        for: 15s
        labels:
          severity: warning
          component: plugin-tenant-lifecycle
        annotations:
          summary: "Plugin-Lifecycle-Claim ohne frischen Heartbeat"
          description: "Mindestens ein persistierter Lifecycle-Claim ist älter als das 120-Sekunden-Lease-SLO."
          runbook_url: "https://github.com/smart-village-solutions/sva-studio/blob/main/docs/operations/plugin-tenant-lifecycle-operations.md"

      - alert: PluginTenantLifecycleStaleClaimCritical
        expr: |
          max by (reason_code) (sva_plugin_tenant_lifecycle_stall_count{reason_code="stale_claim"}) > 0
        for: 30s
        labels:
          severity: critical
          component: plugin-tenant-lifecycle
        annotations:
          summary: "Plugin-Lifecycle-Claim bleibt überaltert"
          description: "Mindestens ein überalterter Lifecycle-Claim wurde nicht durch den persistenten Recovery-Pfad übernommen."
          runbook_url: "https://github.com/smart-village-solutions/sva-studio/blob/main/docs/operations/plugin-tenant-lifecycle-operations.md"

      - alert: PluginTenantLifecycleDueWorkStalledWarning
        expr: |
          max by (reason_code) (
            sva_plugin_tenant_lifecycle_stall_count{reason_code=~"queued_due|retry_due|pending_recheck_due"}
          ) > 0
        for: 15s
        labels:
          severity: warning
          component: plugin-tenant-lifecycle
        annotations:
          summary: "Fällige Plugin-Lifecycle-Arbeit wartet"
          description: "Persistierte Queue-, Retry- oder Pending-Recheck-Arbeit ist fällig und noch nicht verarbeitet."
          runbook_url: "https://github.com/smart-village-solutions/sva-studio/blob/main/docs/operations/plugin-tenant-lifecycle-operations.md"

      - alert: PluginTenantLifecycleDueWorkStalledCritical
        expr: |
          max by (reason_code) (
            sva_plugin_tenant_lifecycle_stall_count{reason_code=~"queued_due|retry_due|pending_recheck_due"}
          ) > 0
        for: 30s
        labels:
          severity: critical
          component: plugin-tenant-lifecycle
        annotations:
          summary: "Fällige Plugin-Lifecycle-Arbeit bleibt blockiert"
          description: "Fällige persistierte Lifecycle-Arbeit wurde über das kritische Alarmfenster hinaus nicht verarbeitet."
          runbook_url: "https://github.com/smart-village-solutions/sva-studio/blob/main/docs/operations/plugin-tenant-lifecycle-operations.md"

      - alert: PluginTenantLifecycleGenerationWithoutOwnerWarning
        expr: |
          max by (reason_code) (
            sva_plugin_tenant_lifecycle_stall_count{reason_code="generation_without_owner"}
          ) > 0
        for: 15s
        labels:
          severity: warning
          component: plugin-tenant-lifecycle
        annotations:
          summary: "Plugin-Lifecycle-Generation ohne aktiven Owner"
          description: "Mindestens eine offene Sollgeneration besitzt keinen aktiven öffentlichen Studio-Job-Owner."
          runbook_url: "https://github.com/smart-village-solutions/sva-studio/blob/main/docs/operations/plugin-tenant-lifecycle-operations.md"

      - alert: PluginTenantLifecycleGenerationWithoutOwnerCritical
        expr: |
          max by (reason_code) (
            sva_plugin_tenant_lifecycle_stall_count{reason_code="generation_without_owner"}
          ) > 0
        for: 30s
        labels:
          severity: critical
          component: plugin-tenant-lifecycle
        annotations:
          summary: "Plugin-Lifecycle-Generation bleibt ohne Owner"
          description: "Eine offene Sollgeneration bleibt ohne aktiven Studio-Job-Owner und benötigt sichere Korrelation."
          runbook_url: "https://github.com/smart-village-solutions/sva-studio/blob/main/docs/operations/plugin-tenant-lifecycle-operations.md"

      - alert: PluginTenantLifecycleObservabilityUnavailableWarning
        expr: |
          max by (reason_code) (sva_plugin_tenant_lifecycle_observation_failure) > 0
        for: 15s
        labels:
          severity: warning
          component: plugin-tenant-lifecycle
        annotations:
          summary: "Plugin-Lifecycle-Aggregatsnapshot nicht verfügbar"
          description: "Der sichere aggregierte Lifecycle-Diagnosevertrag konnte nicht gelesen werden."
          runbook_url: "https://github.com/smart-village-solutions/sva-studio/blob/main/docs/operations/plugin-tenant-lifecycle-operations.md"

      - alert: PluginTenantLifecycleObservabilityUnavailableCritical
        expr: |
          max by (reason_code) (sva_plugin_tenant_lifecycle_observation_failure) > 0
        for: 30s
        labels:
          severity: critical
          component: plugin-tenant-lifecycle
        annotations:
          summary: "Plugin-Lifecycle-Observability bleibt ausgefallen"
          description: "Der Aggregatsnapshot bleibt über das kritische Alarmfenster hinaus nicht verfügbar."
          runbook_url: "https://github.com/smart-village-solutions/sva-studio/blob/main/docs/operations/plugin-tenant-lifecycle-operations.md"

  - name: iam_role_sync_alerts
    interval: 1m
    rules:
      - alert: IamRoleSyncFailureRateHigh
        expr: |
          sum(rate(iam_role_sync_operations_total{result="failure"}[15m]))
          /
          clamp_min(sum(rate(iam_role_sync_operations_total[15m])), 0.001) > 0.05
        for: 15m
        labels:
          severity: warning
          component: iam-role-sync
        annotations:
          summary: "IAM Rollen-Sync-Fehlerquote erhöht"
          description: "Mehr als 5% der Rollen-Sync-Operationen schlagen seit 15 Minuten fehl."

      - alert: IamRoleSyncFailureRateCritical
        expr: |
          sum(rate(iam_role_sync_operations_total{result="failure"}[10m]))
          /
          clamp_min(sum(rate(iam_role_sync_operations_total[10m])), 0.001) > 0.20
        for: 10m
        labels:
          severity: critical
          component: iam-role-sync
        annotations:
          summary: "IAM Rollen-Sync-Fehlerquote kritisch"
          description: "Mehr als 20% der Rollen-Sync-Operationen schlagen seit 10 Minuten fehl."

      - alert: IamRoleDriftBacklogDetected
        expr: |
          max by (instance_id) (iam_role_drift_backlog) > 0
        for: 15m
        labels:
          severity: warning
          component: iam-role-sync
        annotations:
          summary: "IAM Rollen-Drift erkannt"
          description: "Für Instance {{ $labels.instance_id }} besteht seit mindestens 15 Minuten ein Drift-Backlog."

      - alert: IamRoleDriftBacklogCritical
        expr: |
          max by (instance_id) (iam_role_drift_backlog) > 0
        for: 60m
        labels:
          severity: critical
          component: iam-role-sync
        annotations:
          summary: "IAM Rollen-Drift über SLO-Grenze"
          description: "Für Instance {{ $labels.instance_id }} besteht seit mindestens 60 Minuten ein Drift-Backlog."

  - name: iam_instance_registry_alerts
    interval: 1m
    rules:
      - alert: TenantAdminClientDriftDetected
        expr: |
          max by (instance_id) (sva_instance_admin_client_drift) > 0
        for: 10m
        labels:
          severity: warning
          component: instance-registry
        annotations:
          summary: "Tenant-Admin-Client-Drift erkannt"
          description: "Für die aktive Instanz {{ $labels.instance_id }} fehlt seit mindestens 10 Minuten der Tenant-Admin-Client oder dessen Secret."

      - alert: TenantAdminClientDriftCritical
        expr: |
          max by (instance_id) (sva_instance_admin_client_drift) > 0
        for: 30m
        labels:
          severity: critical
          component: instance-registry
        annotations:
          summary: "Tenant-Admin-Client-Drift kritisch"
          description: "Für die aktive Instanz {{ $labels.instance_id }} besteht seit mindestens 30 Minuten Tenant-Admin-Client-Drift. Reconcile, Backfill oder Rollback ist erforderlich."
