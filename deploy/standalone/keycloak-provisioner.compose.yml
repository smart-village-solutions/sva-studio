services:
  app:
    image: ${SVA_IMAGE_REF:?SVA_IMAGE_REF must be set}

  migrate:
    image: ${SVA_IMAGE_REF:?SVA_IMAGE_REF must be set}
    entrypoint:
      - ./migrate-entrypoint.sh
    env_file:
      - ./runtime.env
    environment:
      POSTGRES_USER: sva
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      WASTE_TENANT_MIGRATIONS_ENABLED: 'false'
      SSF_PLUGIN_DATABASE_ENABLED: 'true'
      SSF_PLUGIN_DATABASE_NAME: sva_studio_ssf
      SSF_PLUGIN_RUNTIME_DB_USER: sva_ssf_runtime
      SSF_PLUGIN_ROOT_DB_USER: sva_ssf_root
    restart: 'no'
    networks:
      - studio-internal

  provisioner:
    image: ${SVA_IMAGE_REF:?SVA_IMAGE_REF must be set}
    entrypoint:
      - ./provisioner-entrypoint.sh
    command:
      - node
      - --import
      - ./otel-bootstrap.mjs
      - node_modules/@sva/auth-runtime/dist/iam-instance-registry/worker.js
    env_file:
      - ./runtime.env
    environment:
      SVA_PROVISIONER_COMBINED_WORKER: 'false'
    restart: unless-stopped
    networks:
      - studio-internal
      - ssf-edge

networks:
  studio-internal:
    external: true
    name: sva-studio-ssf_internal
  ssf-edge:
    external: true
    name: ssf-backend_default
