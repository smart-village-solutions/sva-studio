services:
  app:
    image: ${SVA_IMAGE_REF:?SVA_IMAGE_REF must be set}
    environment:
      SVA_INSTANCE_PROVISIONER_INTERNAL_BASE_URL: 'http://provisioner:3000'

  migrate:
    image: ${SVA_IMAGE_REF:?SVA_IMAGE_REF must be set}
    entrypoint:
      - ./migrate-entrypoint.sh
    env_file:
      - ./runtime.env
    environment:
      POSTGRES_USER: sva
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      WASTE_TENANT_MIGRATIONS_ENABLED: 'false'
      SSF_PLUGIN_DATABASE_ENABLED: 'true'
      SSF_PLUGIN_DATABASE_NAME: sva_studio_ssf
      SSF_PLUGIN_RUNTIME_DB_USER: sva_ssf_runtime
      SSF_PLUGIN_ROOT_DB_USER: sva_ssf_root
    restart: 'no'
    networks:
      - studio-internal
      - ssf-edge

  provisioner:
    image: ${SVA_IMAGE_REF:?SVA_IMAGE_REF must be set}
    entrypoint:
      - ./provisioner-entrypoint.sh
    env_file:
      - ./runtime.env
    environment:
      SVA_INSTANCE_PROVISIONER_LOCAL_HANDLING: 'true'
      SVA_PROVISIONER_COMBINED_WORKER: 'true'
    restart: unless-stopped
    networks:
      - studio-internal
      - ssf-edge

networks:
  studio-internal:
    external: true
    name: sva-studio-ssf_internal
  ssf-edge:
    external: true
    name: ssf-backend_default
