publiccodeYmlVersion: "0"
name: Frag den Assistenten
url: https://github.com/smart-village-solutions/sva-studio
platforms:
  - web
developmentStatus: concept
softwareType: addon
description:
  de:
    shortDescription: Geplantes Assistenzmodul im Studio; es ist noch nicht verfügbar oder
      einer Instanz zuweisbar.
    longDescription: Geplantes Assistenzmodul im Studio; es ist noch nicht verfügbar oder
      einer Instanz zuweisbar. Dieses Plugin ist als eigenständiger Assistentenbereich
      vorbereitet. Die bestehende Oberfläche dient nur als Vorschau. Eine fachliche
      Antwortfunktion und deren Zugriffsregeln sind noch nicht Teil des verfügbaren
      Studio-Umfangs. Das Plugin ist im Katalog als in Entwicklung gekennzeichnet. Es
      bietet derzeit keine zuweisbare Funktion und wird nicht als verfügbares Modul
      geladen. Die Beschreibung erläutert ausschließlich den geplanten Bereich und macht
      den Entwicklungsstand in der Modulübersicht sichtbar. Eine spätere Freigabe
      benötigt einen eigenen geprüften Funktionsumfang und die reguläre
      Plugin-Registrierung.
    features:
      - Frag den Assistenten im SVA Studio nutzen
  en:
    localisedName: Ask the Assistant
    shortDescription: Planned Studio assistant module; it is not yet available or assignable
      to an instance.
    longDescription: Planned Studio assistant module; it is not yet available or assignable
      to an instance. This addon belongs to SVA Studio and is described independently
      from its technical package identifier. The module overview displays its public
      name, purpose, and current availability so administrators can understand the scope
      before assigning it to an instance. Access to available modules is still governed
      by the Studio module assignment and the relevant permissions. The source package
      carries this metadata with the plugin, so it can move to a separate repository
      together with the module.
    features:
      - Use Ask the Assistant in SVA Studio
