platforms:
  - web
developmentStatus: development
softwareType: addon
description:
  de:
    shortDescription: Gestaltet Cockpit-Kacheln mit Text, Bildern und Link; Kategorien,
      Reihenfolge und Veröffentlichung steuern die Anzeige.
    longDescription: Gestaltet Cockpit-Kacheln mit Text, Bildern und Link; Kategorien,
      Reihenfolge und Veröffentlichung steuern die Anzeige. Redaktionsteams pflegen
      Überschrift, Sprache und redaktionellen Inhalt einzelner Kacheln. Bilder und
      weiterführende Links können ergänzt werden. Sortierung, Kategorisierung und
      Veröffentlichungsstatus bestimmen die Darstellung im Cockpit. Das Modul ist Teil
      der modularen SVA-Studio-Plattform für kommunale Redaktions- und
      Verwaltungsprozesse. Eine Instanz erhält den Fachbereich über ihre Modulzuweisung;
      Rollen und Berechtigungen steuern die einzelnen Aktionen. Die Modulübersicht zeigt
      Name, Beschreibung und Aktivierungsstatus, damit Verantwortliche den Zweck des
      Bereichs vor der Zuweisung erkennen können.
    features:
      - Cockpit-Kacheln im SVA Studio nutzen
  en:
    localisedName: Cockpit Cards
    shortDescription: Builds cockpit cards with text, images, and a link; categories, order,
      and publication control their display.
    longDescription: Builds cockpit cards with text, images, and a link; categories, order,
      and publication control their display. This addon belongs to SVA Studio and is
      described independently from its technical package identifier. The module overview
      displays its public name, purpose, and current availability so administrators can
      understand the scope before assigning it to an instance. Access to available
      modules is still governed by the Studio module assignment and the relevant
      permissions. The source package carries this metadata with the plugin, so it can
      move to a separate repository together with the module.
    features:
      - Use Cockpit Cards in SVA Studio
