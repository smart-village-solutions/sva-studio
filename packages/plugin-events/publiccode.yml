description:
  de:
    shortDescription: Erfasst Veranstaltungen mit Terminen, Veranstaltungsorten, Kontakten,
      Medien und Veröffentlichungsangaben.
    longDescription: Erfasst Veranstaltungen mit Terminen, Veranstaltungsorten, Kontakten,
      Medien und Veröffentlichungsangaben. Redaktionsteams erfassen einzelne oder
      wiederkehrende Termine samt Uhrzeiten, Orten und Veranstaltern. Ergänzende Angaben
      wie Preise, Zugänglichkeit und weiterführende Links können am
      Veranstaltungseintrag gepflegt werden. Das Modul ist Teil der modularen
      SVA-Studio-Plattform für kommunale Redaktions- und Verwaltungsprozesse. Eine
      Instanz erhält den Fachbereich über ihre Modulzuweisung; Rollen und Berechtigungen
      steuern die einzelnen Aktionen. Die Modulübersicht zeigt Name, Beschreibung und
      Aktivierungsstatus, damit Verantwortliche den Zweck des Bereichs vor der Zuweisung
      erkennen können.
    features:
      - Veranstaltungen im SVA Studio nutzen
  en:
    localisedName: Events
    shortDescription: Maintains events with dates, venues, contacts, media, and publication settings.
    longDescription: Maintains events with dates, venues, contacts, media, and publication
      settings. This addon belongs to SVA Studio and is described independently from its
      technical package identifier. The module overview displays its public name,
      purpose, and current availability so administrators can understand the scope
      before assigning it to an instance. Access to available modules is still governed
      by the Studio module assignment and the relevant permissions. The source package
      carries this metadata with the plugin, so it can move to a separate repository
      together with the module.
    features:
      - Use Events in SVA Studio
