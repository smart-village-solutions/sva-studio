publiccodeYmlVersion: "0"
name: Generische Inhalte
url: https://github.com/smart-village-solutions/sva-studio
platforms:
  - web
developmentStatus: development
softwareType: addon
description:
  de:
    shortDescription: Erfasst frei modellierbare Inhalte mit Typ, Text, Kontakten, Ortsbezug
      und ergänzenden Fachdaten.
    longDescription: Erfasst frei modellierbare Inhalte mit Typ, Text, Kontakten, Ortsbezug
      und ergänzenden Fachdaten. Dieses Modul deckt Inhalte ab, für die kein eigenes
      Fachmodul besteht. Redaktionsteams kombinieren redaktionelle Textblöcke mit
      Kategorien, Medien, Kontakten, Adressen und Zusatzdaten. Der Inhaltstyp macht die
      Einträge für verschiedene Anwendungsfälle nutzbar. Das Modul ist Teil der
      modularen SVA-Studio-Plattform für kommunale Redaktions- und Verwaltungsprozesse.
      Eine Instanz erhält den Fachbereich über ihre Modulzuweisung; Rollen und
      Berechtigungen steuern die einzelnen Aktionen. Die Modulübersicht zeigt Name,
      Beschreibung und Aktivierungsstatus, damit Verantwortliche den Zweck des Bereichs
      vor der Zuweisung erkennen können.
    features:
      - Generische Inhalte im SVA Studio nutzen
  en:
    localisedName: Generic Content
    shortDescription: Captures flexible content with a type, text, contacts, locations, and
      additional domain data.
    longDescription: Captures flexible content with a type, text, contacts, locations, and
      additional domain data. This addon belongs to SVA Studio and is described
      independently from its technical package identifier. The module overview displays
      its public name, purpose, and current availability so administrators can
      understand the scope before assigning it to an instance. Access to available
      modules is still governed by the Studio module assignment and the relevant
      permissions. The source package carries this metadata with the plugin, so it can
      move to a separate repository together with the module.
    features:
      - Use Generic Content in SVA Studio
