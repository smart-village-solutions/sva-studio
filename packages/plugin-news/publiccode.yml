publiccodeYmlVersion: "0"
name: Nachrichten
url: https://github.com/smart-village-solutions/sva-studio
platforms:
  - web
developmentStatus: development
softwareType: addon
description:
  de:
    shortDescription: Erstellt und veröffentlicht Nachrichten mit Text, Medien,
      Veröffentlichungszeitpunkt und optionaler Push-Benachrichtigung.
    longDescription: Erstellt und veröffentlicht Nachrichten mit Text, Medien,
      Veröffentlichungszeitpunkt und optionaler Push-Benachrichtigung. Redaktionsteams
      pflegen Überschrift, Inhalt, Kategorien und Medien eines Beitrags. Sie können die
      Sichtbarkeit vorbereiten und den Zeitpunkt der Veröffentlichung steuern. Für
      aktuelle Meldungen gibt es eine gesonderte Push-Aktion. Das Modul ist Teil der
      modularen SVA-Studio-Plattform für kommunale Redaktions- und Verwaltungsprozesse.
      Eine Instanz erhält den Fachbereich über ihre Modulzuweisung; Rollen und
      Berechtigungen steuern die einzelnen Aktionen. Die Modulübersicht zeigt Name,
      Beschreibung und Aktivierungsstatus, damit Verantwortliche den Zweck des Bereichs
      vor der Zuweisung erkennen können.
    features:
      - Nachrichten im SVA Studio nutzen
  en:
    localisedName: News
    shortDescription: Creates and publishes news with text, media, publication timing, and
      optional push notifications.
    longDescription: Creates and publishes news with text, media, publication timing, and
      optional push notifications. This addon belongs to SVA Studio and is described
      independently from its technical package identifier. The module overview displays
      its public name, purpose, and current availability so administrators can
      understand the scope before assigning it to an instance. Access to available
      modules is still governed by the Studio module assignment and the relevant
      permissions. The source package carries this metadata with the plugin, so it can
      move to a separate repository together with the module.
    features:
      - Use News in SVA Studio
