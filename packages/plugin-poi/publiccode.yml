platforms:
  - web
developmentStatus: development
softwareType: addon
description:
  de:
    shortDescription: Verwaltet Orte mit Adresse, Lage, Öffnungszeiten, Kontakten, Bildern
      und weiteren Ortsinformationen.
    longDescription: Verwaltet Orte mit Adresse, Lage, Öffnungszeiten, Kontakten, Bildern
      und weiteren Ortsinformationen. Das Ortsverzeichnis bündelt redaktionelle
      Beschreibungen und strukturierte Standortdaten. Teams können Kontakte, Weblinks,
      Preise, Betreiberangaben und Medien ergänzen und den Veröffentlichungsstatus eines
      Ortes steuern. Das Modul ist Teil der modularen SVA-Studio-Plattform für kommunale
      Redaktions- und Verwaltungsprozesse. Eine Instanz erhält den Fachbereich über ihre
      Modulzuweisung; Rollen und Berechtigungen steuern die einzelnen Aktionen. Die
      Modulübersicht zeigt Name, Beschreibung und Aktivierungsstatus, damit
      Verantwortliche den Zweck des Bereichs vor der Zuweisung erkennen können.
    features:
      - Orte im SVA Studio nutzen
  en:
    localisedName: Places
    shortDescription: Manages places with addresses, locations, opening hours, contacts,
      images, and other place details.
    longDescription: Manages places with addresses, locations, opening hours, contacts,
      images, and other place details. This addon belongs to SVA Studio and is described
      independently from its technical package identifier. The module overview displays
      its public name, purpose, and current availability so administrators can
      understand the scope before assigning it to an instance. Access to available
      modules is still governed by the Studio module assignment and the relevant
      permissions. The source package carries this metadata with the plugin, so it can
      move to a separate repository together with the module.
    features:
      - Use Places in SVA Studio
