name: Suche
url: https://github.com/smart-village-solutions/sva-studio
platforms:
  - web
developmentStatus: development
softwareType: addon
description:
  de:
    shortDescription: Öffentliche Mainserver-Inhalte im Studio suchen und nach Inhaltstyp, Kategorie und Datenanbieter filtern.
    longDescription: >-
      Das optionale Suchmodul ergänzt die Kopfzeile des SVA Studios um einen gemeinsamen
      Sucheinstieg und eine eigene Ergebnisseite. Es verwendet vorhandene Meilisearch-Indizes
      für sichtbare Mainserver-Inhalte. Studio prüft jeden Treffer serverseitig mit den
      bestehenden Ressourcenrechten des Benutzers und seiner aktiven Organisation.
      Suchbegriff und Filter bleiben über die URL wiederherstellbar. Die Anzeige unterscheidet
      zugängliche Ergebnisse, aggregierte Berechtigungsablehnungen und unvollständige Prüfungen.
      Titel, Vorschauen und Filteroptionen ausgeschlossener Inhalte werden nicht ausgegeben.
      Unsichtbare Inhalte und Studio-eigene Daten gehören nicht zum ersten Umfang.
    features:
      - Sucheinstieg in der Kopfzeile und eigene Ergebnisseite
      - Kombinierbare Filter für Inhaltstyp, Kategorie und Datenanbieter
      - Serverseitige Ressourcenprüfung und vollständigkeitsabhängige Trefferzahlen
  en:
    localisedName: Search
    shortDescription: Search public Mainserver content in Studio and filter by content type, category and data provider.
    longDescription: >-
      The optional search module adds a shared search entry to the SVA Studio header and
      provides a dedicated results page. It uses existing Meilisearch indexes for visible
      Mainserver content. Studio checks each result on the server using existing resource
      permissions for the user and the active organization. Search terms and filters can
      be restored from the URL. The interface distinguishes accessible results, aggregate
      permission denials and incomplete checks. Titles, previews and filter options from
      excluded content are never returned. Invisible records and Studio-owned data remain
      outside the initial scope. Deployment requires a separately configured restricted key.
    features:
      - Header entry and dedicated results page
      - Combined content type, category and data provider filters
      - Server-side resource checks and completeness-aware result counts

