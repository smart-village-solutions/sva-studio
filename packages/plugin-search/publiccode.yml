publiccodeYmlVersion: "0"
name: Suche
url: https://github.com/smart-village-solutions/sva-studio
platforms:
  - web
developmentStatus: concept
softwareType: addon
description:
  de:
    shortDescription: Geplantes Suchmodul im Studio; es ist noch nicht verfügbar oder einer
      Instanz zuweisbar.
    longDescription: Geplantes Suchmodul im Studio; es ist noch nicht verfügbar oder einer
      Instanz zuweisbar. Dieses Plugin ist als eigenständiger Suchbereich vorbereitet.
      Die bisherige Darstellung dient als Vorschau. Eine nutzbare Suche über
      Studio-Inhalte ist noch nicht freigegeben und kann derzeit nicht aktiviert werden.
      Das Plugin ist im Katalog als in Entwicklung gekennzeichnet. Es bietet derzeit
      keine zuweisbare Funktion und wird nicht als verfügbares Modul geladen. Die
      Beschreibung erläutert ausschließlich den geplanten Bereich und macht den
      Entwicklungsstand in der Modulübersicht sichtbar. Eine spätere Freigabe benötigt
      einen eigenen geprüften Funktionsumfang und die reguläre Plugin-Registrierung.
    features:
      - Suche im SVA Studio nutzen
  en:
    localisedName: Search
    shortDescription: Planned Studio search module; it is not yet available or assignable to an instance.
    longDescription: Planned Studio search module; it is not yet available or assignable to
      an instance. This addon belongs to SVA Studio and is described independently from
      its technical package identifier. The module overview displays its public name,
      purpose, and current availability so administrators can understand the scope
      before assigning it to an instance. Access to available modules is still governed
      by the Studio module assignment and the relevant permissions. The source package
      carries this metadata with the plugin, so it can move to a separate repository
      together with the module.
    features:
      - Use Search in SVA Studio
