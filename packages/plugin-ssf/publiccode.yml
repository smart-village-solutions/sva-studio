name: Smart Speech Flow
url: https://github.com/smart-village-solutions/sva-studio
platforms:
  - web
developmentStatus: development
softwareType: addon
description:
  de:
    shortDescription: Konfiguriert Sprachen, Texte und Einstellungen für Gespräche und
      Feedback im Smart Speech Flow.
    longDescription: Konfiguriert Sprachen, Texte und Einstellungen für Gespräche und
      Feedback im Smart Speech Flow. Administrierende pflegen installationsweite
      Standards und mandantenspezifische Abweichungen. Dazu gehören Sprachwahl,
      redaktionelle Texte, Gesprächsspeicherung und Elemente der Feedback-Oberfläche.
      Das Modul verbindet diese Einstellungen mit dem jeweiligen Mandanten. Das Modul
      ist Teil der modularen SVA-Studio-Plattform für kommunale Redaktions- und
      Verwaltungsprozesse. Eine Instanz erhält den Fachbereich über ihre Modulzuweisung;
      Rollen und Berechtigungen steuern die einzelnen Aktionen. Die Modulübersicht zeigt
      Name, Beschreibung und Aktivierungsstatus, damit Verantwortliche den Zweck des
      Bereichs vor der Zuweisung erkennen können.
    features:
      - Smart Speech Flow im SVA Studio nutzen
  en:
    localisedName: Smart Speech Flow
    shortDescription: Configures languages, copy, and settings for conversations and
      feedback in Smart Speech Flow.
    longDescription: Configures languages, copy, and settings for conversations and feedback
      in Smart Speech Flow. This addon belongs to SVA Studio and is described
      independently from its technical package identifier. The module overview displays
      its public name, purpose, and current availability so administrators can
      understand the scope before assigning it to an instance. Access to available
      modules is still governed by the Studio module assignment and the relevant
      permissions. The source package carries this metadata with the plugin, so it can
      move to a separate repository together with the module.
    features:
      - Use Smart Speech Flow in SVA Studio
