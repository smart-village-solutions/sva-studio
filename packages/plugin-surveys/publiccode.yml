publiccodeYmlVersion: "0"
name: Umfragen
url: https://github.com/smart-village-solutions/sva-studio
platforms:
  - web
developmentStatus: development
softwareType: addon
description:
  de:
    shortDescription: Erstellt Umfragen mit Fragen und Zielgebieten; Freitexte können
      moderiert und Ergebnisse exportiert werden.
    longDescription: Erstellt Umfragen mit Fragen und Zielgebieten; Freitexte können
      moderiert und Ergebnisse exportiert werden. Redaktionsteams strukturieren Umfragen
      mit Fragen und Antwortoptionen. Zielgebiete grenzen die Teilnahme ein.
      Freitextantworten lassen sich moderieren, während Ergebnisansichten und
      Exportfunktionen die Auswertung unterstützen. Das Modul ist Teil der modularen
      SVA-Studio-Plattform für kommunale Redaktions- und Verwaltungsprozesse. Eine
      Instanz erhält den Fachbereich über ihre Modulzuweisung; Rollen und Berechtigungen
      steuern die einzelnen Aktionen. Die Modulübersicht zeigt Name, Beschreibung und
      Aktivierungsstatus, damit Verantwortliche den Zweck des Bereichs vor der Zuweisung
      erkennen können.
    features:
      - Umfragen im SVA Studio nutzen
  en:
    localisedName: Surveys
    shortDescription: Creates surveys with questions and target areas; free text can be
      moderated and results exported.
    longDescription: Creates surveys with questions and target areas; free text can be
      moderated and results exported. This addon belongs to SVA Studio and is described
      independently from its technical package identifier. The module overview displays
      its public name, purpose, and current availability so administrators can
      understand the scope before assigning it to an instance. Access to available
      modules is still governed by the Studio module assignment and the relevant
      permissions. The source package carries this metadata with the plugin, so it can
      move to a separate repository together with the module.
    features:
      - Use Surveys in SVA Studio
