cleanupUnusedCatalogs: true
injectWorkspacePackages: true
linkWorkspacePackages: true
preferWorkspacePackages: true
engineStrict: true
nodeVersion: 24.15.0
minimumReleaseAge: 1440
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeStrict: true
trustPolicy: no-downgrade
trustPolicyExclude:
  # Legacy toolchains in the current Nx/Babel/TanStack plugin graph still resolve semver 6.3.1.
  # Remove this exact-version exception once the transitive graph no longer requires semver 6.x.
  - semver@6.3.1
blockExoticSubdeps: true
packageExtensions:
  # Beide Scaleflex-Pakete importieren Babel-Helper ohne eigene Runtime-Abhängigkeit.
  "@scaleflex/icons@3.0.0-beta.10":
    dependencies:
      "@babel/runtime": "7.29.7"
  "@scaleflex/ui@3.0.0-beta.10":
    dependencies:
      "@babel/runtime": "7.29.7"
allowBuilds:
  bufferutil: true
  esbuild: true
  msw: false
  nx@22.7.1 || 22.7.4 || 23.0.1 || 23.0.2 || 23.1.1 || 23.2.1: true
  protobufjs: false
  sharp: true
overrides:
  # @tiptap/react resolves these optional peers independently; keep their exact peer versions aligned.
  "@tiptap/react>@tiptap/extension-bubble-menu": "3.31.3"
  "@tiptap/react>@tiptap/extension-floating-menu": "3.31.3"
  "@tanstack/react-router": "1.170.41"
  "@tanstack/react-start": "1.168.60"
  "@tanstack/router-core": "1.171.34"
  "@tanstack/router-plugin": "1.168.42"
  "@tanstack/start-plugin-core": "1.171.49"
  ast-v8-to-istanbul: "1.0.0"
  tinyexec: "1.1.2"
  esbuild: "0.28.1"
  h3: "2.0.1-rc.20"
  minimatch: "10.2.3"
  # Nx pinnt diese transitiven Pakete exakt; die Overrides halten sie auf gepatchten Versionen.
  "nx>brace-expansion": "5.0.12"
  "nx>smol-toml": "1.9.0"
  axios: "1.20.0"
  form-data: "4.0.6"
  follow-redirects: "1.16.1"
  launch-editor: "2.14.2"
  postcss: "8.5.23"
  protobufjs: "7.6.3"
  rollup: "4.59.0"
  srvx: "0.11.15"
  solid-js: "1.9.11"
  seroval: "1.6.8"
  "@types/node@22>undici-types": "6.18.2"
  pino: "9.12.0"
  slow-redact: "0.3.1"
  tmp: "0.2.7"
  uuid: "11.1.1"
  js-yaml: "4.3.2"
  "@opentelemetry/core": "2.8.0"
  "@actions/github>undici": "6.29.1"
  "@actions/http-client>undici": "6.29.1"
  "jsdom>undici": "7.30.1"
  "ajv>fast-uri": "3.1.9"
  "express>body-parser": "2.4.0"

packages:
  - apps/*
  - packages/*
  - tooling/*
